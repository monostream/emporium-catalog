apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "chart.fullname" . }}-agent
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
---
# Namespace-scoped: the agent creates pipeline pods, volumes and step secrets in this
# namespace only. There is no ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "chart.fullname" . }}-agent
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
rules:
  - apiGroups: [""]
    resources: [persistentvolumeclaims, services, secrets]
    verbs: [create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [watch, create, delete, get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "chart.fullname" . }}-agent
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "chart.fullname" . }}-agent
subjects:
  - kind: ServiceAccount
    name: {{ include "chart.fullname" . }}-agent
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}-agent
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  # The agent id lives on a ReadWriteOnce volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "chart.agentSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chart.labels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: {{ include "chart.fullname" . }}-agent
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: WOODPECKER_SERVER
              value: {{ printf "%s-server.%s.svc:9000" (include "chart.fullname" .) .Release.Namespace | quote }}
            - name: WOODPECKER_BACKEND
              value: kubernetes
            - name: WOODPECKER_BACKEND_K8S_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: WOODPECKER_BACKEND_K8S_VOLUME_SIZE
              value: {{ .Values.agent.workspaceVolumeSize | quote }}
            {{- with .Values.agent.workspaceStorageClass }}
            - name: WOODPECKER_BACKEND_K8S_STORAGE_CLASS
              value: {{ . | quote }}
            {{- end }}
            # ReadWriteMany is the Woodpecker default; most block-storage classes only offer ReadWriteOnce.
            - name: WOODPECKER_BACKEND_K8S_STORAGE_RWX
              value: {{ .Values.agent.workspaceRWX | quote }}
            - name: WOODPECKER_MAX_WORKFLOWS
              value: {{ .Values.agent.maxWorkflows | quote }}
            - name: WOODPECKER_AGENT_CONFIG_FILE
              value: /etc/woodpecker/agent.conf
            - name: WOODPECKER_HEALTHCHECK_ADDR
              value: ":3000"
            {{- with .Values.secrets.name }}
            - name: WOODPECKER_AGENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secrets.agentSecretKey }}
            {{- end }}
          ports:
            - name: health
              containerPort: 3000
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 10
          volumeMounts:
            - name: data
              mountPath: /etc/woodpecker
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.agent.persistence.claimName }}
          persistentVolumeClaim:
            claimName: {{ .Values.agent.persistence.claimName }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
