apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.fullname" . }}-server
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
    # Agents connect here (gRPC). Not exposed through the ingress.
    - name: grpc
      port: 9000
      targetPort: grpc
  selector:
    {{- include "chart.serverSelectorLabels" . | nindent 4 }}
