apiVersion: emporium.build/v1

integrations:
  web:
    type: ingress
    access: { default: authenticated }
    bind:
      IngressClassName: ingress.className

components:
  app:
    label: draw.io
    resources: resources
    # Diagrams are stored in the browser or the user's cloud storage; pods share no state.
    replicas: { path: replicaCount, min: 1, max: 3 }

profiles:
  default: small
  small:
    label: Small
    description: Personal use and small teams
    values: profiles/small.yaml
