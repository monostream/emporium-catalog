# Default values for drawio.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
image:
  repository: jgraph/drawio
  pullPolicy: IfNotPresent
  tag: "32.5.5"
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
drawio:
  publicDns: domain.com
  # Subject of the self-signed certificate the image creates for its unused HTTPS port.
  organisationUnit: unit
  organisation: org
  city: city
  state: state
  countryCode: country
  baseUrl:
  cspHeader: "default-src 'self'; script-src 'self' https://storage.googleapis.com https://apis.google.com https://docs.google.com https://code.jquery.com 'unsafe-inline'; connect-src 'self' https://*.dropboxapi.com https://api.trello.com https://api.github.com https://raw.githubusercontent.com https://*.googleapis.com https://*.googleusercontent.com https://graph.microsoft.com https://*.1drv.com https://*.sharepoint.com https://gitlab.com https://*.google.com https://fonts.gstatic.com https://fonts.googleapis.com; img-src * data:; media-src * data:; font-src * about:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; frame-src 'self' https://*.google.com;"
  viewerUrl:
  lightboxUrl:
  config:
  googleClientId:
  googleAppId:
  googleClientSecret:
  googleViewerClientId:
  googleViewerAppId:
  googleViewerClientSecret:
  msGraphClientId:
  msGraphClientSecret:
  msGraphTenantId:
  gitlabId:
  gitlabSecret:
  gitlabUrl:
  cloudConvertApiKey:
  cacheDomain:
  memcachedEndpoint:
  iotEndpoint:
  iotCertPem:
  iotPrivateKey:
  iotRootCa:
  mxPusherEndpoint:
serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}

# The image runs Tomcat as tomcat (UID 1001, GID 999). Its entrypoint writes the DRAWIO_*
# configuration into the webapp at start, so the root filesystem stays writable.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 999
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 768Mi

nodeSelector: {}

tolerations: []

affinity: {}
