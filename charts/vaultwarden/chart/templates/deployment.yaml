apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "chart.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "chart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
          - name: DOMAIN
            value: {{ .Values.app.domain | quote }}
          - name: SIGNUPS_ALLOWED
            value: {{ .Values.app.signupsAllowed | quote }}
          {{- with .Values.app.smtp }}
          {{- if .host }}
          - name: SMTP_HOST
            value: {{ .host | quote }}
          - name: SMTP_PORT
            value: {{ .port | quote }}
          - name: SMTP_FROM
            value: {{ .from | quote }}
          - name: SMTP_FROM_NAME
            value: {{ .fromName | quote }}
          {{- if .username }}
          - name: SMTP_USERNAME
            value: {{ .username | quote }}
          {{- end }}
          {{- if .existingSecret }}
          - name: SMTP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .existingSecret | quote }}
                key: {{ required "app.smtp.passwordKey is required with app.smtp.existingSecret" .passwordKey | quote }}
          {{- end }}
          {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /data
              name: data
      volumes:
      - name: data
        {{- if and .Values.storage.data.enabled .Values.storage.data.existingClaim }}
        persistentVolumeClaim:
          claimName: {{ .Values.storage.data.existingClaim }}
        {{- else if .Values.storage.data.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "chart.fullname" . }}-data
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
