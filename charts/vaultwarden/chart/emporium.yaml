apiVersion: emporium.build/v1

inputs:
  SignupsAllowed:
    label: Allow sign-ups
    description: Let anyone who can reach the page create an account.
    type: boolean
    default: true
    path: app.signupsAllowed

integrations:
  web:
    type: ingress
    access: { default: authenticated }
    # Bitwarden clients and the web vault talk to these APIs with their own tokens.
    skipPaths: [/api/*, /identity/*]
    # Vaultwarden's own OIDC login; this path is also skipped above, so the callback reaches the app.
    redirectPaths: [/identity/connect/oidc-signin]
    bind:
      IngressClassName: ingress.className
  sso:
    type: oidc
  mail:
    type: smtp
    required: false
  data:
    type: storage
    size: { default: 1Gi, growOnly: true }
    bind:
      ClaimName: storage.data.existingClaim

  db:
    type: postgres
    required: false
    database: vaultwarden
    owner: vaultwarden
    version: "17"
    storage: { default: 5Gi, growOnly: true }
    # postgresql://...?sslmode=require: encrypted (libpq cannot be given the CA through the URL key).
    secretKeys:
      DATABASE_URL: uri-sslmode-require

components:
  app:
    label: Vaultwarden
    resources: resources
    replicas: { fixed: 1, reason: "SQLite database and attachments on a ReadWriteOnce volume" }
  db:
    label: PostgreSQL
    integration: db

profiles:
  default: small
  small:
    label: Small
    description: Families and small teams
    values: profiles/small.yaml
    integrations:
      db: { instances: 1 }
