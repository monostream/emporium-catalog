apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "uptrace.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
    - port: 4317
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{- include "uptrace.selectorLabels" . | nindent 4 }}
