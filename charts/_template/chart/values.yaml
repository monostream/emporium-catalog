# Base configuration. Must render on its own (lint renders with defaults).
nameOverride: ""
fullnameOverride: ""

image:
  repository: nginxinc/nginx-unprivileged # TODO: your application image
  tag: "" # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 8080

config:
  logLevel: info
  publicUrl: ""

# Filled by Emporium through the `web` ingress integration (emporium.yaml bind + values.emporium.yaml).
ingress:
  enabled: true
  className: "" # never hard-code a class: Emporium sets it from the ingress output IngressClassName
  host: ""
  annotations: {}
  tlsSecretName: ""
  tlsHosts: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: [ALL]
