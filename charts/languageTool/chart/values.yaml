# Default values for languagetool.

replicaCount: 1

image:
  repository: erikvl87/languagetool
  pullPolicy: IfNotPresent
  tag: "6.8"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Environment of the container. Java_Xms/Java_Xmx set the JVM heap; langtool_<key> entries are
# written to LanguageTool's config.properties (see the image documentation).
env:
  Java_Xms: 256m
  Java_Xmx: 512m

# The image runs as languagetool (UID 100, GID 101).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8010

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 768Mi
  limits:
    memory: 1536Mi

nodeSelector: {}

tolerations: []

affinity: {}
