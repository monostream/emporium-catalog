neuvector:
  controller:
    secret:
      enabled: true
      data:
        # NeuVector reads its OIDC settings from this file only, so the client secret is written
        # into the chart's neuvector-init Secret (lint: plaintext-secret-output, accepted).
        # The admin password is not set here: the controller generates one into
        # neuvector-bootstrap-secret on first start.
        oidcinitcfg.yaml:
          always_reload: true
          enable: true
          issuer: {{ .Emporium.Integrations.oidc.Issuer | quote }}
          client_id: {{ .Emporium.Integrations.oidc.ClientID | quote }}
          client_secret: {{ .Emporium.Integrations.oidc.ClientSecret | quote }}
          default_role: reader
          scopes: [openid, profile, email]

  manager:
    ingress:
      enabled: true
      path: /
      annotations: {{ .Emporium.Integrations.web.Annotations | toJson }}
      tls: true
