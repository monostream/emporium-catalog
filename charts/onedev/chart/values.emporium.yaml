onedev:
  onedev:
    initSettings:
      email: {{ printf "onedev@%s" .Emporium.Integrations.web.Hostname | quote }}
      serverUrl: {{ printf "https://%s" .Emporium.Integrations.web.Hostname | quote }}

  ingress:
    enabled: true
    annotations: {{ .Emporium.Integrations.web.Annotations | toJson }}
    host: {{ .Emporium.Integrations.web.Hostname | quote }}
    tls:
      enabled: true
      secretName: {{ .Emporium.Integrations.web.TLSSecretName | quote }}

  # OneDev reads the initial admin password and the hibernate_* database settings from the
  # environment. The upstream chart's own database wiring (database.external) would copy the
  # password into its Secret from plain values, so the settings are given here by reference.
  env:
    - name: initial_password
      valueFrom:
        secretKeyRef:
          name: {{ .Emporium.Secrets.Name | quote }}
          key: Password
    {{- with .Emporium.Integrations.db }}
    - name: hibernate_dialect
      value: io.onedev.server.persistence.PostgreSQLDialect
    - name: hibernate_connection_driver_class
      value: org.postgresql.Driver
    - name: hibernate_connection_url
      # sslmode=require: encrypted; the JDBC driver has no CloudNativePG CA to verify against.
      value: {{ printf "jdbc:postgresql://%s:%v/%s?sslmode=require" .Host .Port .Database | quote }}
    - name: hibernate_connection_username
      value: {{ .Username | quote }}
    - name: hibernate_connection_password
      valueFrom:
        secretKeyRef:
          name: {{ .SecretName | quote }}
          key: {{ .PasswordKey | quote }}
    - name: hibernate_hikari_maximumPoolSize
      value: "25"
    {{- end }}
