{{- $prom := .Emporium.Inputs.PrometheusEnabled }}
{{- $nodeLogs := .Emporium.Inputs.NodeLogCollection }}
prometheus:
  prometheusOperator:
    enabled: {{ input "PrometheusEnabled" }}
  prometheus:
    enabled: {{ input "PrometheusEnabled" }}
    # Set here, not by path: the Prometheus CR only renders with Prometheus enabled.
    prometheusSpec:
      storageSpec:
        volumeClaimTemplate:
          spec:
            resources:
              requests:
                storage: {{ input "PrometheusStorageSize" }}
  nodeExporter:
    enabled: {{ input "PrometheusEnabled" }}
  # Rules, control-plane ServiceMonitors and their exporters are only useful with Prometheus.
  defaultRules:
    create: {{ input "PrometheusEnabled" }}
  kubeApiServer:
    enabled: {{ input "PrometheusEnabled" }}
  kubelet:
    enabled: {{ input "PrometheusEnabled" }}
  kubeStateMetrics:
    enabled: {{ input "PrometheusEnabled" }}
  alertmanager:
    enabled: {{ input "PrometheusEnabled" }}
  coreDns:
    enabled: {{ input "PrometheusEnabled" }}
  kubeEtcd:
    enabled: {{ input "PrometheusEnabled" }}

  grafana:
    # Client secret by reference; the client id and URLs are not secret.
    envValueFrom:
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
        secretKeyRef:
          name: {{ .Emporium.Integrations.sso.SecretName | quote }}
          key: {{ .Emporium.Integrations.sso.ClientSecretKey | quote }}
    grafana.ini:
      server:
        root_url: {{ printf "https://%s" .Emporium.Integrations.web.Hostname | quote }}
      auth:
        # Logging out lands on the local login form: with auto_login the normal login page would
        # sign the user straight back in. (No Logto end-session: Emporium registers no post-logout URIs.)
        signout_redirect_url: "/login?disableAutoLogin=true"
      auth.generic_oauth:
        enabled: true
        name: Emporium
        client_id: {{ .Emporium.Integrations.sso.ClientID | quote }}
        scopes: openid email profile roles
        use_pkce: true
        allow_sign_up: true
        # Straight to the Emporium login (a silent redirect: glass already authenticated the user).
        # The local admin form stays reachable at /login?disableAutoLogin=true.
        auto_login: true
        # Logto endpoints below the issuer (<issuer>/auth, /token, /me).
        auth_url: {{ printf "%s/auth" .Emporium.Integrations.sso.Issuer | quote }}
        token_url: {{ printf "%s/token" .Emporium.Integrations.sso.Issuer | quote }}
        api_url: {{ printf "%s/me" .Emporium.Integrations.sso.Issuer | quote }}
        login_attribute_path: email
        email_attribute_path: email
        name_attribute_path: name
        allow_assign_grafana_admin: true
    ingress:
      enabled: true
      annotations: {{ .Emporium.Integrations.web.Annotations | toJson }}
      hosts:
        - {{ .Emporium.Integrations.web.Hostname | quote }}
      tls:
        - secretName: {{ .Emporium.Integrations.web.TLSSecretName | quote }}
          hosts: {{ .Emporium.Integrations.web.AllHosts | toJson }}
    sidecar:
      datasources:
        enabled: {{ input "PrometheusEnabled" }}
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
        {{- if $prom }}
        - name: Prometheus
          type: prometheus
          uid: prometheus
          url: {{ printf "http://%s-prometheus-prometheus:9090" .Emporium.Name | quote }}
          access: proxy
        {{- end }}
        - name: Loki
          type: loki
          uid: loki
          url: {{ printf "http://%s-loki:3100" .Emporium.Name | quote }}
          jsonData:
            maxLines: 1000
            derivedFields:
            - name: Trace ID
              datasourceUid: tempo
              matcherRegex: "traceId=(\\w+)"
              url: "$${__value.raw}"
          access: proxy
        - name: Tempo
          type: tempo
          uid: tempo
          url: {{ printf "http://%s-tempo:3200" .Emporium.Name | quote }}
          access: proxy

alloy:
  alloy:
    configMap:
      create: true
      content: |-
        logging {
                level  = "warn"
                format = "logfmt"
        }

        discovery.kubernetes "kubernetes_pods" {
                role = "pod"
                {{- if not $nodeLogs }}

                // Each Alloy pod (one per node) streams only the pods on its own node.
                selectors {
                        role  = "pod"
                        field = "spec.nodeName=" + sys.env("HOSTNAME")
                }
                {{- end }}
        }

        discovery.relabel "kubernetes_pods" {
                targets = discovery.kubernetes.kubernetes_pods.targets

                rule {
                        source_labels = ["__meta_kubernetes_pod_controller_name"]
                        regex         = "([0-9a-z-.]+?)(-[0-9a-f]{8,10})?"
                        target_label  = "__tmp_controller_name"
                }

                rule {
                        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app", "__tmp_controller_name", "__meta_kubernetes_pod_name"]
                        regex         = "^;*([^;]+)(;.*)?$"
                        target_label  = "app"
                }

                rule {
                        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_instance", "__meta_kubernetes_pod_label_instance"]
                        regex         = "^;*([^;]+)(;.*)?$"
                        target_label  = "instance"
                }

                rule {
                        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component", "__meta_kubernetes_pod_label_component"]
                        regex         = "^;*([^;]+)(;.*)?$"
                        target_label  = "component"
                }

                rule {
                        source_labels = ["__meta_kubernetes_pod_node_name"]
                        target_label  = "node_name"
                }

                rule {
                        source_labels = ["__meta_kubernetes_namespace"]
                        target_label  = "namespace"
                }

                rule {
                        source_labels = ["namespace", "app"]
                        separator     = "/"
                        target_label  = "job"
                }

                rule {
                        source_labels = ["__meta_kubernetes_pod_name"]
                        target_label  = "pod"
                }

                rule {
                        source_labels = ["__meta_kubernetes_pod_container_name"]
                        target_label  = "container"
                }
                {{- if $nodeLogs }}

                rule {
                        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                        separator     = "/"
                        target_label  = "__path__"
                        replacement   = "/var/log/pods/*$1/*.log"
                }

                rule {
                        source_labels = ["__meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash", "__meta_kubernetes_pod_annotation_kubernetes_io_config_hash", "__meta_kubernetes_pod_container_name"]
                        separator     = "/"
                        regex         = "true/(.*)"
                        target_label  = "__path__"
                        replacement   = "/var/log/pods/*$1/*.log"
                }
                {{- end }}
        }
        {{- if $nodeLogs }}

        local.file_match "kubernetes_pods" {
                path_targets = discovery.relabel.kubernetes_pods.output
        }

        loki.process "kubernetes_pods" {
                forward_to = [loki.write.default.receiver]

                stage.cri { }
        }

        loki.source.file "kubernetes_pods" {
                targets               = local.file_match.kubernetes_pods.targets
                forward_to            = [loki.process.kubernetes_pods.receiver]
                legacy_positions_file = "/run/promtail/positions.yaml"
        }
        {{- else }}

        // Without the /var/log hostPath mount (PodSecurity baseline): read container logs through the Kubernetes API.
        loki.source.kubernetes "kubernetes_pods" {
                targets    = discovery.relabel.kubernetes_pods.output
                forward_to = [loki.write.default.receiver]
        }
        {{- end }}

        loki.write "default" {
                endpoint {
                        url = "http://{{ .Emporium.Name }}-loki:3100/loki/api/v1/push"
                }
                external_labels = {}
        }
