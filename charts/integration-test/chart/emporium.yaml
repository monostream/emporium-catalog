apiVersion: emporium.build/v1

integrations:
  # The e2e suite (test/ in emporium) expects the ingress integration to be named "ingress".
  ingress:
    type: ingress
    access: { default: authenticated }
    # Extra hosts <subdomain>-second.<zone> and <subdomain>-third.<zone> on the same Ingress,
    # so the suite checks glass and the OIDC redirect URIs on more than one host.
    hosts: [second, third]
    redirectPaths: [/test/callback, /test2/callback]
    bind:
      Annotations: ingress.annotations
      IngressClassName: ingress.className

components:
  app:
    label: Hello
    resources: resources
    replicas: { path: replicaCount, min: 1, max: 3 }

profiles:
  default: small
  small:
    label: Small
    description: One stateless pod
    values: profiles/small.yaml
