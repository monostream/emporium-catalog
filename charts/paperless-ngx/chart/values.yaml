# Base configuration. Renders on its own; Emporium fills the connection values
# through emporium.yaml (bind, inputs) and values.emporium.yaml.
nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/paperless-ngx/paperless-ngx
  tag: "3.3.3"
  pullPolicy: IfNotPresent

service:
  port: 8000

config:
  # Public URL of the instance (PAPERLESS_URL), e.g. https://paperless.example.com
  url: ""
  timeZone: UTC
  # Tesseract languages, "+" separated (PAPERLESS_OCR_LANGUAGE). The image ships eng, deu, fra, ita and spa.
  ocrLanguage: eng
  # OCR is CPU and memory hungry: documents processed in parallel = taskWorkers, threads each = threadsPerWorker.
  taskWorkers: 1
  threadsPerWorker: 1
  webserverWorkers: 1
  # Optional Apache Tika and Gotenberg endpoints (office documents and e-mail). Both must be set to enable them.
  tikaEndpoint: ""
  gotenbergEndpoint: ""

# Django secret key (sessions, signed URLs). Secret and key holding it.
secretKey:
  existingSecret: ""
  key: SecretKey

# Break-glass local superuser, created at the first start when the database has no superuser
# (PAPERLESS_ADMIN_USER / PAPERLESS_ADMIN_PASSWORD).
admin:
  username: admin
  existingSecret: ""
  passwordKey: AdminPassword

# PostgreSQL, provided by the postgres integration (CloudNativePG).
database:
  host: ""
  port: 5432
  name: paperless
  user: paperless
  sslmode: require
  # Secret and key holding the database password.
  existingSecret: ""
  passwordKey: password

# Redis (Valkey), provided by the redis integration.
redis:
  # Secret and key holding the redis:// URL.
  existingSecret: ""
  urlKey: url

# OpenID Connect login (django-allauth openid_connect provider, "Continue with <providerName>").
oidc:
  enabled: false
  # Issuer URL; allauth appends /.well-known/openid-configuration.
  issuer: ""
  clientId: ""
  # Secret and key holding the client secret. It reaches allauth through an environment
  # variable reference inside PAPERLESS_SOCIALACCOUNT_PROVIDERS; it is never part of the pod spec.
  existingSecret: ""
  clientSecretKey: clientSecret
  providerName: Emporium
  # Name of the id token role that makes the user a Paperless superuser (roles claim).
  adminRole: emporium-admin
  # Create the Paperless account at the first sign-in (PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS). When false only
  # already linked social accounts can sign in (link from a local login: My Profile > Connected social accounts).
  userCreation: true

smtp:
  enabled: false
  host: ""
  port: 587
  username: ""
  from: ""
  existingSecret: ""
  passwordKey: ""
  useTLS: true

# Documents, media, search index and consume folder live below this claim.
persistence:
  claimName: ""

# Additional environment variables (see https://docs.paperless-ngx.com/configuration/).
extraEnv: []

# Filled by Emporium through the `web` ingress integration.
ingress:
  enabled: true
  className: ""
  host: ""
  annotations: {}
  tlsSecretName: ""
  tlsHosts: []

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    memory: 3Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
