apiVersion: v2
name: nextcloud
description: A safe home for all your data – community-driven, free & open source.
type: application
version: 0.1.0
appVersion: "35.0.1"
dependencies:
  - name: nextcloud
    version: 9.4.0
    repository: https://nextcloud.github.io/helm/
home: https://nextcloud.com/
icon: https://raw.githubusercontent.com/monostream/test-charts/main/assets/nextcloud/nextcloud_icon_2.svg
annotations:
  icon: assets/icon.svg
  displayName: Nextcloud
  category: Utilities
  licenses: AGPL-3.0
  gallery: |
    https://raw.githubusercontent.com/nextcloud/screenshots/master/nextcloud-hub-files-25-preview.png
  emporiumVersion: v0.5.0
  emporium.build/postgres: |
    database: nextcloud
    owner: nextcloud
    version: "17"
    storage: 8Gi
