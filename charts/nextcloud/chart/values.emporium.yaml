{{- $web := .Emporium.Integrations.web }}
{{- $db := .Emporium.Integrations.postgres }}
{{- $redis := .Emporium.Integrations.redis }}
{{- $sso := .Emporium.Integrations.sso }}
nextcloud:
  ingress:
    enabled: true
    # Nextcloud uploads in chunks, but single files can still be large: no body size limit.
    # (A limit above 4 GiB, such as 5000m, makes the ingress answer 500 for the whole host.)
    {{- $annotations := dict "nginx.ingress.kubernetes.io/proxy-body-size" "0" }}
    {{- range $k, $v := $web.Annotations }}{{ $_ := set $annotations $k $v }}{{ end }}
    annotations: {{ $annotations | toJson }}
    tls:
      - secretName: {{ $web.TLSSecretName | quote }}
        hosts: {{ $web.AllHosts | toJson }}

  nextcloud:
    host: {{ $web.Hostname | quote }}
    existingSecret:
      enabled: true
    extraEnv:
      - name: OVERWRITECLIURL
        value: {{ printf "https://%s" $web.Hostname | quote }}
      # CloudNativePG always serves TLS. libpq reads PGSSLMODE; Nextcloud's own pgsql_ssl setting
      # is not used because it writes empty sslrootcert/sslcert/... entries into the PDO DSN.
      - name: PGSSLMODE
        value: {{ $db.SSLMode | quote }}
      # The image runs occ (install, upgrade, hooks) with `su -p www-data`, which keeps
      # HOME=/root. libpq then fails on the unreadable default client certificate
      # /root/.postgresql/postgresql.crt ("Permission denied") instead of skipping it. A path
      # that does not exist means "no client certificate".
      - name: PGSSLCERT
        value: /nonexistent/postgresql.crt
      # Emporium SSO, read by the before-starting hook (values.yaml). occ reads the client
      # secret from the environment (--clientsecret-env), so it is never a command argument.
      - name: EMPORIUM_OIDC_CLIENT_ID
        value: {{ $sso.ClientID | quote }}
      - name: EMPORIUM_OIDC_DISCOVERY_URI
        value: {{ $sso.ConfigurationEndpoint | quote }}
      - name: EMPORIUM_OIDC_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: {{ $sso.SecretName | quote }}
            key: {{ $sso.ClientSecretKey | quote }}
      {{- with .Emporium.Integrations.mail }}
      {{- $from := regexFind "[^<>[:space:]]+@[^<>[:space:]]+" .From }}
      - name: SMTP_HOST
        value: {{ .Host | quote }}
      - name: SMTP_PORT
        value: {{ .Port | quote }}
      # 465 is implicit TLS; on other ports Nextcloud upgrades with STARTTLS when offered.
      - name: SMTP_SECURE
        value: {{ if eq (int .Port) 465 }}"ssl"{{ else }}""{{ end }}
      - name: SMTP_NAME
        value: {{ .Username | quote }}
      - name: SMTP_PASSWORD
        valueFrom:
          secretKeyRef:
            name: {{ .SecretName | quote }}
            key: {{ .PasswordKey | quote }}
      - name: MAIL_FROM_ADDRESS
        value: {{ splitList "@" $from | first | quote }}
      - name: MAIL_DOMAIN
        value: {{ splitList "@" $from | last | quote }}
      {{- end }}

  internalDatabase:
    enabled: false
  externalDatabase:
    enabled: true
    type: postgresql
    host: {{ printf "%s:%v" $db.Host $db.Port | quote }}
    database: {{ $db.Database | quote }}
    existingSecret:
      enabled: true
      secretName: {{ $db.SecretName | quote }}
      usernameKey: {{ $db.UsernameKey | quote }}
      passwordKey: {{ $db.PasswordKey | quote }}

  externalRedis:
    enabled: true
    host: {{ $redis.Host | quote }}
    port: {{ $redis.Port | quote }}
    existingSecret:
      enabled: true
      secretName: {{ $redis.SecretName | quote }}
      passwordKey: {{ $redis.PasswordKey | quote }}
