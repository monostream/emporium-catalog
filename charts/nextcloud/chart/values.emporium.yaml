nextcloud:
  ingress:
    enabled: true

    annotations:
      kubernetes.io/tls-acme: "true"
      {{- if .Emporium.Annotations }}
      {{- toYaml .Emporium.Annotations | nindent 6 }}
      {{- end }}

      nginx.ingress.kubernetes.io/proxy-body-size: 5000m
    hosts:
      - host: {{ .Emporium.Integrations.DNS.Hostname }}
        paths:
          - path: /
            pathType: Prefix

    tls:
      - secretName: nextcloud-tls
        hosts:
          - {{ .Emporium.Integrations.DNS.Hostname }}

  phpClientHttpsFix:
    enabled: true
    protocol: https

  nextcloud:
    host: {{ .Emporium.Integrations.DNS.Hostname }}
    username:
    password:
    ## Use an existing secret
    existingSecret:
      enabled: true
      secretName: nextcloud-admin-credentials
      usernameKey: nextcloud-username
      passwordKey: nextcloud-password
      tokenKey: nextcloud-token
      # smtpUsernameKey: smtp-username
      # smtpPasswordKey: smtp-password

    datadir: /var/www/html/data
    persistence:
      subPath:
    mail:
      enabled: false
      fromAddress: user
      domain: {{ .Emporium.Integrations.DNS.Hostname }}
      smtp:
        host: domain.com
        secure: ssl
        port: 465
        authtype: LOGIN
        name: user
        password: pass


  internalDatabase:
    enabled: false

  externalDatabase:
    enabled: true
    type: postgresql
    host: "{{ .Emporium.Integrations.Postgres.Host }}:{{ .Emporium.Integrations.Postgres.Port }}"
    database: {{ .Emporium.Integrations.Postgres.Database | quote }}
    existingSecret:
      enabled: true
      secretName: {{ .Emporium.Integrations.Postgres.SecretName | quote }}
      usernameKey: {{ .Emporium.Integrations.Postgres.UsernameKey | quote }}
      passwordKey: {{ .Emporium.Integrations.Postgres.PasswordKey | quote }}

  postgresql:
    enabled: false

  ##
  ## Redis chart configuration
  ## for more options see https://github.com/bitnami/charts/tree/main/bitnami/redis
  ##
  redis:
    enabled: true
    auth:
      enabled: true
      password:
      existingSecret: "nextcloud-redis"
      existingSecretPasswordKey: "redis-password"


## @userSupplied StorageSize
## @label StorageSize
## @type byteSize
## @description The size of the storage volume
  persistence:
    # Nextcloud Data (/var/www/html)
    enabled: true
    annotations: {}

    accessMode: ReadWriteOnce
    size: "{{ .Emporium.UserSupplied.StorageSize }}"

    ## Use an additional pvc for the data directory rather than a subpath of the default PVC
    ## Useful to store data on a different storageClass (e.g. on slower disks)
    nextcloudData:
      enabled: false
      subPath:
      annotations: {}
      # storageClass: "-"
      # existingClaim:
      accessMode: ReadWriteOnce
      size: 100Gi
