apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  replicas: 1
  # One SQLite database on a ReadWriteOnce volume; never run two pods side by side.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chart.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: actual
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: ACTUAL_PORT
              value: {{ .Values.service.port | quote }}
            - name: ACTUAL_DATA_DIR
              value: /data
            - name: ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB
              value: {{ .Values.config.uploadLimitMB | quote }}
            - name: ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB
              value: {{ .Values.config.uploadLimitMB | quote }}
            - name: ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB
              value: {{ .Values.config.uploadLimitMB | quote }}
            {{- with .Values.oidc }}
            {{- if and .enabled .discoveryUrl $.Values.config.baseUrl }}
            - name: ACTUAL_LOGIN_METHOD
              value: openid
            - name: ACTUAL_ALLOWED_LOGIN_METHODS
              value: openid,password
            - name: ACTUAL_OPENID_DISCOVERY_URL
              value: {{ .discoveryUrl | quote }}
            - name: ACTUAL_OPENID_PROVIDER_NAME
              value: {{ .providerName | quote }}
            - name: ACTUAL_OPENID_CLIENT_ID
              value: {{ .clientId | quote }}
            - name: ACTUAL_OPENID_SERVER_HOSTNAME
              value: {{ $.Values.config.baseUrl | quote }}
            - name: ACTUAL_OPENID_AUTH_METHOD
              value: {{ .authMethod | quote }}
            - name: ACTUAL_USER_CREATION_MODE
              value: {{ ternary "login" "manual" .autoCreate | quote }}
            {{- with .existingSecret }}
            - name: ACTUAL_OPENID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.oidc.clientSecretKey }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /health, port: http }
          readinessProbe:
            httpGet: { path: /health, port: http }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.storage.data.existingClaim | default (printf "%s-data" (include "chart.fullname" .)) }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
