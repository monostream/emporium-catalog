nameOverride: ""

# PostgreSQL database. Emporium provides it with its native Postgres
# integration (CloudNativePG) and fills these values in values.emporium.yaml.
database:
  host: ""
  port: 5432
  name: plausible
  username: plausible
  # Secret holding the password (the CNPG app secret).
  existingSecret: ""
  passwordKey: password

plausible:
  baseURL: ""
  disableRegistration: true
  logFailedLoginAttempts: true

  secret:
    create: false
    existingSecret: plausible

  postgresql:
    enabled: false

  clickhouse:
    fullnameOverride: plausible-clickhouse
    auth:
      existingSecret: plausible
      existingSecretKey: "CLICKHOUSE_PASSWORD"
    persistence:
      enabled: true
      size: 10Gi
