apiVersion: v1
kind: Secret
metadata:
  name: plausible
  labels:
    app: plausible
  {{- include "plausible.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $secret := (lookup "v1" "Secret" .Release.Namespace "plausible") }}
  {{- if $secret }}
  SECRET_KEY_BASE: {{ index $secret.data "SECRET_KEY_BASE" }}
  {{- else }}
  SECRET_KEY_BASE: {{ randAlphaNum 90 | toString | b64enc }}
  {{- end }}

  {{- if $secret }}
  TOTP_VAULT_KEY: {{ index $secret.data "TOTP_VAULT_KEY" }}
  {{- else }}
  # This must be base64 encoded twice
  TOTP_VAULT_KEY: {{ randAlphaNum 32 | toString | b64enc | b64enc }}
  {{- end }}

  {{- /*
  Plausible reads DATABASE_URL from this Secret, so the URL is assembled from
  the CloudNativePG app secret Emporium provides (database.existingSecret).
  Emporium creates that Secret before installing the chart; helm template
  renders an empty password because lookup returns nothing there.
  The scheme is postgres:// because the subchart's wait-for-postgres script
  only parses that form. TLS is not set in the URL: DATABASE_CACERTFILE
  (values.emporium.yaml) turns it on with certificate verification.
  */}}
  {{- $db := .Values.database }}
  {{- $dbSecret := (lookup "v1" "Secret" .Release.Namespace $db.existingSecret) }}
  {{- $dbPassword := "" }}
  {{- if and $dbSecret $dbSecret.data }}
  {{- $dbPassword = index $dbSecret.data $db.passwordKey | default "" | b64dec }}
  {{- end }}

  DATABASE_URL: {{ printf "postgres://%s:%s@%s:%v/%s" $db.username $dbPassword $db.host $db.port $db.name | b64enc }}

  {{- $clickhousePassword := randAlphaNum 32 }}

  {{- if and $secret (index $secret.data "CLICKHOUSE_PASSWORD") }}
  {{- $clickhousePassword = index $secret.data "CLICKHOUSE_PASSWORD" | b64dec }}
  {{- end }}

  CLICKHOUSE_PASSWORD: {{ $clickhousePassword | b64enc }}

  CLICKHOUSE_DATABASE_URL: {{ printf "http://clickhouse:%s@plausible-clickhouse:8123/plausible" $clickhousePassword | b64enc }}

  {{- if .Values.plausible.mailer.enabled }}
  {{- if eq .Values.plausible.mailer.adapter "Bamboo.SMTPAdapter" }}
  {{- if .Values.plausible.mailer.smtp.password }}
  SMTP_USER_PWD: {{ .Values.plausible.mailer.smtp.password | toString | b64enc }}
  {{- end }}
  {{- end }}
  {{- end }}
