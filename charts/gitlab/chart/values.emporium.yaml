## @userSupplied RepositoryStorageSize
## @label Repository Storage Size
## @type byteSize
## @description Size of the volume holding the Git repositories (Gitaly). Default is 50Gi.
## @optional

## @userSupplied ObjectStorageSize
## @label Object Storage Size
## @type byteSize
## @description Size of the object storage volume (RustFS) for artifacts, uploads, LFS, packages, container images, backups and the runner cache. Default is 20Gi.
## @optional

emporium:
  oidc:
    issuer: {{ .Emporium.Integrations.OIDC.Issuer | quote }}
    clientId: {{ .Emporium.Integrations.OIDC.ClientID | quote }}
    clientSecret: {{ .Emporium.Integrations.OIDC.ClientSecret | quote }}
    redirectUri: "https://{{ .Emporium.Integrations.DNS.Hostname }}/users/auth/openid_connect/callback"

global:
  hosts:
    domain: {{ .Emporium.Integrations.DNS.Hostname }}
    gitlab:
      name: {{ .Emporium.Integrations.DNS.Hostname }}

  ingress:
    ## GitLab authenticates these paths itself, so Emporium's proxy lets them
    ## through: sign-in and the OIDC callback, Git over HTTPS, the API (also
    ## used by runners), OAuth, the registry token endpoint, health checks and
    ## static assets. Emporium's own annotations take precedence.
    {{- $annotations := dict
      "emporium.build/auth-skip-paths" `/, /favicon.ico, /users/sign_in, /users/auth/*, /-/manifest.json, /-/health, /-/readiness, /-/liveness, /-/kubernetes-agent/*, /api/*, /assets/*, /oauth/*, /.well-known/*, /jwt/auth, /static/*, regex(^(\/([^\/])+){2,}\.git.*$)`
      "kubernetes.io/tls-acme" "true"
      "nginx.ingress.kubernetes.io/proxy-body-size" "0"
      "nginx.ingress.kubernetes.io/proxy-connect-timeout" "15"
      "nginx.ingress.kubernetes.io/proxy-read-timeout" "600"
      "nginx.ingress.kubernetes.io/service-upstream" "true"
    }}
    {{- range $key, $value := .Emporium.Annotations }}
    {{- $_ := set $annotations $key $value }}
    {{- end }}
    annotations:
      {{- toYaml $annotations | nindent 6 }}

  appConfig:
    omniauth:
      providers:
        - secret: {{ .Emporium.Name }}-oidc-provider
          key: provider
    object_store:
      connection:
        secret: {{ .Emporium.Name }}-object-storage
        key: connection

  psql:
    host: {{ .Emporium.Integrations.Postgres.Host }}
    port: {{ .Emporium.Integrations.Postgres.Port }}
    database: {{ .Emporium.Integrations.Postgres.Database }}
    username: {{ .Emporium.Integrations.Postgres.Username }}
    password:
      secret: {{ .Emporium.Integrations.Postgres.SecretName }}
      key: {{ .Emporium.Integrations.Postgres.PasswordKey }}

  redis:
    host: {{ .Emporium.Name }}-valkey
    auth:
      secret: {{ .Emporium.Name }}-valkey-auth

gitlab:
  gitlab:
    ## The agent server has its own host and authenticates agents with tokens
    kas:
      ingress:
        annotations:
          emporium.build/disable-glass: "true"
    gitaly:
      persistence:
        size: {{ default "50Gi" .Emporium.UserSupplied.RepositoryStorageSize | quote }}
    toolbox:
      backups:
        objectStorage:
          config:
            secret: {{ .Emporium.Name }}-object-storage
            key: s3cfg

  registry:
    ## The registry has its own host and authenticates with tokens from GitLab
    ingress:
      annotations:
        emporium.build/disable-glass: "true"
    storage:
      secret: {{ .Emporium.Name }}-object-storage

  gitlab-runner:
    runners:
      cache:
        secretName: {{ .Emporium.Name }}-runner-cache

rustfs:
  fullnameOverride: {{ .Emporium.Name }}-rustfs
  secret:
    existingSecret: {{ .Emporium.Name }}-rustfs-credentials
  storageclass:
    dataStorageSize: {{ default "20Gi" .Emporium.UserSupplied.ObjectStorageSize | quote }}

valkey:
  fullnameOverride: {{ .Emporium.Name }}-valkey
