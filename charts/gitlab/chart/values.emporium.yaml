{{- $web := .Emporium.Integrations.web }}
{{- $registryWeb := .Emporium.Integrations.registry }}
{{- $kasWeb := .Emporium.Integrations.kas }}
{{- $sso := .Emporium.Integrations.sso }}
{{- $pg := .Emporium.Integrations.postgres }}
{{- $redis := .Emporium.Integrations.redis }}
{{- $s3 := .Emporium.Integrations.objects }}
emporium:
  oidc:
    issuer: {{ $sso.Issuer | quote }}
    clientId: {{ $sso.ClientID | quote }}
    # lint plaintext-secret-output: GitLab reads the OmniAuth provider, client secret
    # included, from one YAML document in a Secret; there is no reference form.
    clientSecret: {{ $sso.ClientSecret | quote }}
    redirectUri: {{ printf "https://%s/users/auth/openid_connect/callback" $web.Hostname | quote }}
  objectStorage:
    endpoint: {{ $s3.Endpoint | quote }}
    region: {{ $s3.Region | quote }}
    # lint plaintext-secret-output: GitLab (Fog connection YAML), the registry (storage YAML)
    # and backups (s3cfg) take the keys only inside such documents.
    accessKey: {{ $s3.AccessKey | quote }}
    secretKey: {{ $s3.SecretKey | quote }}

global:
  hosts:
    domain: {{ $web.Zone | quote }}
    gitlab:
      name: {{ $web.Hostname | quote }}
    registry:
      name: {{ $registryWeb.Hostname | quote }}
    kas:
      name: {{ $kasWeb.Hostname | quote }}

  ingress:
    class: {{ $web.IngressClassName | default "none" | quote }}
    annotations:
      {{- range $key, $value := $web.Annotations }}
      {{ $key | quote }}: {{ $value | quote }}
      {{- end }}
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    tls:
      secretName: {{ $web.TLSSecretName | quote }}

  appConfig:
    omniauth:
      providers:
        - secret: {{ printf "%s-oidc-provider" .Emporium.Name | quote }}
          key: provider
    object_store:
      connection:
        secret: {{ printf "%s-object-storage" .Emporium.Name | quote }}
        key: connection

  psql:
    host: {{ $pg.Host | quote }}
    port: {{ $pg.Port }}
    database: {{ $pg.Database | quote }}
    username: {{ $pg.Username | quote }}
    password:
      secret: {{ $pg.SecretName | quote }}
      key: {{ $pg.PasswordKey | quote }}

  redis:
    host: {{ $redis.Host | quote }}
    port: {{ $redis.Port }}
    auth:
      enabled: true
      secret: {{ $redis.SecretName | quote }}
      key: {{ $redis.PasswordKey | quote }}

  {{- with .Emporium.Integrations.mail }}
  smtp:
    enabled: true
    address: {{ .Host | quote }}
    port: {{ .Port }}
    {{- if .Username }}
    user_name: {{ .Username | quote }}
    authentication: login
    password:
      secret: {{ .SecretName | quote }}
      key: {{ .PasswordKey | quote }}
    {{- else }}
    authentication: none
    {{- end }}
    # 465 is implicit TLS, every other port upgrades with STARTTLS
    tls: {{ eq (int .Port) 465 }}
    starttls_auto: {{ ne (int .Port) 465 }}
  email:
    from: {{ .From | quote }}
    {{- with .ReplyTo }}
    reply_to: {{ . | quote }}
    {{- end }}
  {{- end }}

gitlab:
  gitlab:
    webservice:
      ingress:
        tls:
          secretName: {{ $web.TLSSecretName | quote }}
    kas:
      ingress:
        # Upstream merges global.ingress.annotations (web) into these; the post-renderer
        # replaces the Emporium-owned keys with the kas integration's.
        annotations: {{ $kasWeb.Annotations | toJson }}
        tls:
          secretName: {{ $kasWeb.TLSSecretName | quote }}
    toolbox:
      backups:
        objectStorage:
          config:
            secret: {{ printf "%s-object-storage" .Emporium.Name | quote }}
            key: s3cfg

  registry:
    ingress:
      annotations: {{ $registryWeb.Annotations | toJson }}
      tls:
        secretName: {{ $registryWeb.TLSSecretName | quote }}
    storage:
      secret: {{ printf "%s-object-storage" .Emporium.Name | quote }}

  gitlab-runner:
    runners:
      cacheS3Address: {{ $s3.Endpoint | trimPrefix "http://" | trimPrefix "https://" | quote }}
      cacheS3Region: {{ $s3.Region | quote }}
      cache:
        secretName: {{ printf "%s-runner-cache" .Emporium.Name | quote }}
