{{- /* Password of Valkey's default user, generated once and kept on upgrades */ -}}
{{- $name := include "gitlab.emporium.name" (list . "valkey-auth") -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
type: Opaque
data:
  default: {{ include "gitlab.emporium.secretValue" (dict "secret" $existing "key" "default" "length" 32) | b64enc | quote }}
