{{- /*
OmniAuth provider for Emporium's identity provider (Logto). The "roles" scope
adds the user's Logto role names to the userinfo response, which
zz_emporium_admin_sync.rb maps to GitLab's admin flag.
*/ -}}
{{- $oidc := .Values.emporium.oidc -}}
{{- $provider := dict
  "name" "openid_connect"
  "label" $oidc.label
  "args" (dict
    "name" "openid_connect"
    "scope" (list "openid" "profile" "email" "roles")
    "response_type" "code"
    "issuer" $oidc.issuer
    "discovery" true
    "client_auth_method" "basic"
    "uid_field" "sub"
    "pkce" true
    "send_scope_to_token_endpoint" false
    "client_options" (dict
      "identifier" $oidc.clientId
      "secret" $oidc.clientSecret
      "redirect_uri" $oidc.redirectUri
    )
  )
-}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gitlab.emporium.name" (list . "oidc-provider") }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
type: Opaque
data:
  provider: {{ toYaml $provider | b64enc | quote }}
