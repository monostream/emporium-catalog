{{- /*
Creates the buckets GitLab, the registry, backups and the runner cache use in
the bundled RustFS. Idempotent; a new Job per Helm revision picks up buckets
added in later chart versions. Not a Helm hook, so installs do not wait for it.
*/ -}}
{{- $image := .Values.emporium.images.awsCli -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "gitlab.emporium.name" (list . (printf "buckets-%d" .Release.Revision)) }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: object-storage-buckets
spec:
  backoffLimit: 20
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "chart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: object-storage-buckets
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: buckets
          image: {{ printf "%s:%s" $image.repository $image.tag | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p "$HOME/.aws"
              printf '[default]\ns3 =\n  addressing_style = path\n' > "$HOME/.aws/config"
              until aws --endpoint-url "$S3_ENDPOINT" s3api list-buckets > /dev/null; do
                echo "waiting for object storage at $S3_ENDPOINT"
                sleep 5
              done
              for bucket in $BUCKETS; do
                if aws --endpoint-url "$S3_ENDPOINT" s3api head-bucket --bucket "$bucket" > /dev/null 2>&1; then
                  echo "bucket $bucket exists"
                else
                  aws --endpoint-url "$S3_ENDPOINT" s3api create-bucket --bucket "$bucket" > /dev/null
                  echo "created bucket $bucket"
                fi
              done
          env:
            - name: HOME
              value: /tmp
            - name: S3_ENDPOINT
              value: {{ printf "http://%s" (include "gitlab.emporium.s3Host" .) | quote }}
            - name: BUCKETS
              value: {{ join " " .Values.emporium.objectStorage.buckets | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.emporium.objectStorage.region | quote }}
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: AWS_REQUEST_CHECKSUM_CALCULATION
              value: when_required
            - name: AWS_RESPONSE_CHECKSUM_VALIDATION
              value: when_required
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "gitlab.emporium.name" (list . "rustfs-credentials") }}
                  key: RUSTFS_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "gitlab.emporium.name" (list . "rustfs-credentials") }}
                  key: RUSTFS_SECRET_KEY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
