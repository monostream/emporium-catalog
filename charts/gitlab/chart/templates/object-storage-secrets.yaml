{{- /*
Credentials of the bundled RustFS, generated once and kept on upgrades, and the
connection settings derived from them for GitLab (Rails, registry, backups)
and the runner cache. All Secrets are rendered here so they share the same
credentials on the first install.
*/ -}}
{{- $credentialsName := include "gitlab.emporium.name" (list . "rustfs-credentials") -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $credentialsName -}}
{{- $accessKey := include "gitlab.emporium.secretValue" (dict "secret" $existing "key" "RUSTFS_ACCESS_KEY" "length" 20) -}}
{{- $secretKey := include "gitlab.emporium.secretValue" (dict "secret" $existing "key" "RUSTFS_SECRET_KEY" "length" 40) -}}
{{- $host := include "gitlab.emporium.s3Host" . -}}
{{- $region := .Values.emporium.objectStorage.region -}}
{{- $connection := dict
  "provider" "AWS"
  "region" $region
  "aws_access_key_id" $accessKey
  "aws_secret_access_key" $secretKey
  "aws_signature_version" 4
  "endpoint" (printf "http://%s" $host)
  "path_style" true
-}}
{{- $registry := dict "s3" (dict
  "accesskey" $accessKey
  "secretkey" $secretKey
  "bucket" (dig "registry" "bucket" "registry" .Values.global)
  "region" $region
  "regionendpoint" (printf "http://%s" $host)
  "secure" false
  "pathstyle" true
) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $credentialsName }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
type: Opaque
data:
  RUSTFS_ACCESS_KEY: {{ $accessKey | b64enc | quote }}
  RUSTFS_SECRET_KEY: {{ $secretKey | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gitlab.emporium.name" (list . "object-storage") }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
type: Opaque
data:
  connection: {{ toYaml $connection | b64enc | quote }}
  registry: {{ toYaml $registry | b64enc | quote }}
  s3cfg: {{ printf "[default]\naccess_key = %s\nsecret_key = %s\nbucket_location = %s\nhost_base = %s\nhost_bucket = %s\nuse_https = False\nsignature_v2 = False\n" $accessKey $secretKey $region $host $host | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gitlab.emporium.name" (list . "runner-cache") }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
type: Opaque
data:
  accesskey: {{ $accessKey | b64enc | quote }}
  secretkey: {{ $secretKey | b64enc | quote }}
