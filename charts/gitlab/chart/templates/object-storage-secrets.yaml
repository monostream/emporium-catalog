{{- /*
S3 connection settings for GitLab (Rails, registry, backups) and the runner
cache, derived from Emporium's objectStorage integration. GitLab reads them
from YAML/INI documents in Secrets, so the credentials arrive as values
(emporium.objectStorage, set by values.emporium.yaml).
*/ -}}
{{- $s3 := .Values.emporium.objectStorage -}}
{{- $endpoint := required "emporium.objectStorage.endpoint is required (objectStorage integration)" $s3.endpoint -}}
{{- $host := trimPrefix "https://" (trimPrefix "http://" $endpoint) -}}
{{- $connection := dict
  "provider" "AWS"
  "region" $s3.region
  "aws_access_key_id" $s3.accessKey
  "aws_secret_access_key" $s3.secretKey
  "aws_signature_version" 4
  "endpoint" $endpoint
  "path_style" true
-}}
{{- $registry := dict "s3" (dict
  "accesskey" $s3.accessKey
  "secretkey" $s3.secretKey
  "bucket" (dig "registry" "bucket" "registry" .Values.global)
  "region" $s3.region
  "regionendpoint" $endpoint
  "secure" (hasPrefix "https://" $endpoint)
  "pathstyle" true
) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gitlab.emporium.name" (list . "object-storage") }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
type: Opaque
data:
  connection: {{ toYaml $connection | b64enc | quote }}
  registry: {{ toYaml $registry | b64enc | quote }}
  s3cfg: {{ printf "[default]\naccess_key = %s\nsecret_key = %s\nbucket_location = %s\nhost_base = %s\nhost_bucket = %s\nuse_https = %s\nsignature_v2 = False\n" $s3.accessKey $s3.secretKey $s3.region $host $host (ternary "True" "False" (hasPrefix "https://" $endpoint)) | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gitlab.emporium.name" (list . "runner-cache") }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
type: Opaque
data:
  accesskey: {{ $s3.accessKey | b64enc | quote }}
  secretkey: {{ $s3.secretKey | b64enc | quote }}
