apiVersion: v2
name: forgejo
description: forgejo is a community managed lightweight code hosting solution written in Go. It is published under the MIT license.
type: application
version: 0.1.0
appVersion: "15.0.9"
dependencies:
  - name: forgejo
    version: 17.2.0
    repository: oci://codeberg.org/forgejo-contrib
home: https://forgejo.org/
icon: https://raw.githubusercontent.com/monostream/test-charts/main/assets/forgejo/forgejo_icon_3.svg
sources:
  - https://forgejo.com/forgejo/helm-chart
keywords:
  - Collaboration
  - Coding
  - Git
  - CI/CD
  - Issue Tracking
annotations:
  icon: assets/icon.svg
  category: Developer Tools
  displayName: forgejo
  licenses: MIT
  oidcRedirectPaths: /user/oauth2/emporium/callback
  emporiumVersion: v0.5.0
  emporium.build/postgres: |
    database: forgejo
    owner: forgejo
    version: "17"
    storage: 10Gi
