## @userSupplied Username
## @label Admin username
## @type string
## @description Admin Username

## @userSupplied Password
## @label Admin password
## @type string
## @description Admin password

## @userSupplied EnableHA
## @label Enable High Availability
## @type boolean
## @description Installs a highly available version of the chart
## @optional

{{- /* Emporium sets auth-skip-paths ('/*') only for Public access. The
       annotations are a map[string]string, which hasKey does not take, so
       they go through JSON first. */}}
{{- $public := hasKey (.Emporium.Annotations | toJson | fromJson) "emporium.build/auth-skip-paths" }}
forgejo:
  redis-cluster:
    enabled: {{ (.Emporium.UserSupplied.EnableHA | default false) }}
  postgresql:
    enabled: {{ not (.Emporium.UserSupplied.EnableHA | default false) }}
  postgresql-ha:
    enabled: {{ (.Emporium.UserSupplied.EnableHA | default false) }}

  persistence:
    enabled: true
    size: 30Gi

  strategy:
    type: 'Recreate'

  ingress:
    enabled: true
    annotations:
      {{- if .Emporium.Annotations }}
      {{- toYaml .Emporium.Annotations | nindent 6 }}
      {{- end }}
      kubernetes.io/tls-acme: "true"
      {{- if not $public }}
      ## Paths that bypass the Emporium login because their clients cannot
      ## do a browser sign-in; Forgejo authenticates them itself:
      ## - /api/*: the REST API with access tokens, Actions runners, packages
      ## - Git smart HTTP (info/refs, git-upload-pack, git-receive-pack) and
      ##   Git LFS (info/lfs/...) of /<owner>/<repo>[.git]; nothing else, so
      ##   the repository web UI stays behind the login
      emporium.build/auth-skip-paths: '/api/*,regex(^/[^/]+/[^/]+/(info/refs|git-upload-pack|git-receive-pack|info/lfs/.*)$)'
      {{- end }}
      nginx.ingress.kubernetes.io/proxy-body-size: '0'
      nginx.ingress.kubernetes.io/proxy-connect-timeout: '15'
      nginx.ingress.kubernetes.io/proxy-read-timeout: '600'
      nginx.ingress.kubernetes.io/service-upstream: 'true'
    hosts:
      - host: {{ .Emporium.Integrations.DNS.Hostname }}
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: {{ .Emporium.Name }}-tls
        hosts:
          - {{ .Emporium.Integrations.DNS.Hostname }}

  gitea:
    admin:
      existingSecret:
      username: {{ .Emporium.UserSupplied.Username }}
      password: {{ .Emporium.UserSupplied.Password }}
      email: 'forgejo@{{ .Emporium.Integrations.DNS.Hostname }}'
    oauth:
      - name: 'emporium'
        provider: 'openidConnect'
        key: "{{ .Emporium.Integrations.OIDC.ClientID }}"
        secret: "{{ .Emporium.Integrations.OIDC.ClientSecret }}"
        autoDiscoverUrl: "{{ .Emporium.Integrations.OIDC.ConfigurationEndpoint }}"
        scopes: "email profile"
        # No group-based admin sync: the identity provider sends no admin
        # group, and syncing would demote (or fail on) the local admin.
        # Empty values also clear the setting on upgraded installs.
        groupClaimName: ""
        adminGroup: ""

    config:
      database:
        DB_TYPE: postgres
      session:
        PROVIDER: db
      cache:
        ADAPTER: {{ ternary "redis-cluster" "memory" (.Emporium.UserSupplied.EnableHA | default false)  }}
      queue:
        TYPE: {{ ternary "redis" "level" (.Emporium.UserSupplied.EnableHA | default false) }}
      indexer:
        ISSUE_INDEXER_TYPE: bleve
        REPO_INDEXER_ENABLED: true
      actions:
        ENABELD: 'true'
      api:
        ENABLE_SWAGGER: 'false'
      service:
        DISABLE_REGISTRATION: 'true'
        SHOW_REGISTRATION_BUTTON: 'false'
        ## Unless the app is public, Forgejo itself requires sign-in, so the
        ## API and Git paths above serve no public repository anonymously.
        REQUIRE_SIGNIN_VIEW: '{{ not $public }}'
      openid:
        ENABLE_OPENID_SIGNIN: 'true'
        ENABLE_OPENID_SIGNUP: 'false'
      oauth2_client:
        ENABLE_AUTO_REGISTRATION: 'true'
        OPENID_CONNECT_SCOPES: 'openid email profile'
        ACCOUNT_LINKING: 'login'
        USERNAME: 'email'
