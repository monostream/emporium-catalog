forgejo:
  persistence:
    enabled: true
    create: false

  ingress:
    enabled: true
    annotations: {{ .Emporium.Integrations.web.Annotations | toJson }}
    hosts:
      - host: {{ .Emporium.Integrations.web.Hostname | quote }}
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: {{ .Emporium.Integrations.web.TLSSecretName | quote }}
        hosts: {{ .Emporium.Integrations.web.AllHosts | toJson }}

  # configure-gitea expands ${OIDC_CLIENT_SECRET} when it adds or updates the oauth source.
  deployment:
    env:
      - name: OIDC_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: {{ .Emporium.Integrations.sso.SecretName | quote }}
            key: {{ .Emporium.Integrations.sso.ClientSecretKey | quote }}

  gitea:
    oauth:
      - name: emporium
        provider: openidConnect
        key: {{ .Emporium.Integrations.sso.ClientID | quote }}
        secret: "${OIDC_CLIENT_SECRET}"
        autoDiscoverUrl: {{ .Emporium.Integrations.sso.ConfigurationEndpoint | quote }}
        # Logto puts the user's role names into the "roles" claim; holders of the
        # Emporium admin role become Forgejo admins. Forgejo also removes admin from
        # users without the role, but refuses to demote the last admin (500), so the
        # chart creates no local admin that could be linked and demoted.
        scopes: "email profile roles"
        groupClaimName: roles
        adminGroup: emporium-admin

    additionalConfigFromEnvs:
      - name: FORGEJO__DATABASE__PASSWD
        valueFrom:
          secretKeyRef:
            name: {{ .Emporium.Integrations.db.SecretName | quote }}
            key: {{ .Emporium.Integrations.db.PasswordKey | quote }}

    config:
      server:
        ROOT_URL: {{ printf "https://%s/" .Emporium.Integrations.web.Hostname | quote }}
      database:
        DB_TYPE: postgres
        HOST: {{ printf "%s:%v" .Emporium.Integrations.db.Host .Emporium.Integrations.db.Port | quote }}
        NAME: {{ .Emporium.Integrations.db.Database | quote }}
        USER: {{ .Emporium.Integrations.db.Username | quote }}
        SSL_MODE: {{ .Emporium.Integrations.db.SSLMode | quote }}
      session:
        PROVIDER: db
      cache:
        ADAPTER: memory
      queue:
        TYPE: level
      indexer:
        ISSUE_INDEXER_TYPE: bleve
        REPO_INDEXER_ENABLED: true
      actions:
        ENABLED: "true"
      api:
        ENABLE_SWAGGER: "false"
      service:
        DISABLE_REGISTRATION: "true"
        SHOW_REGISTRATION_BUTTON: "false"
      openid:
        ENABLE_OPENID_SIGNIN: "true"
        ENABLE_OPENID_SIGNUP: "false"
      oauth2_client:
        ENABLE_AUTO_REGISTRATION: "true"
        OPENID_CONNECT_SCOPES: "openid email profile roles"
        ACCOUNT_LINKING: login
        USERNAME: email
