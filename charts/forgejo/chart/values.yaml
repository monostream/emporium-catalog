forgejo:
  strategy:
    type: Recreate

  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 1Gi

  ingress:
    className: ""
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"

  persistence:
    claimName: gitea-shared-storage

  deployment:
    env: []

  gitea:
    # No local admin: Forgejo admins are the users with the identity provider's
    # admin role (see the oauth source in values.emporium.yaml).
    admin:
      username: ""
    oauth: []
    additionalConfigFromEnvs: []
