{{- if .Values.ingress.enabled -}}
{{- $fullName := include "plane.fullname" . -}}
{{- $annotations := deepCopy (.Values.ingress.annotations | default dict) -}}
{{- /* Uploads go to S3 through this ingress; allow the configured file size plus headroom. */ -}}
{{- $bodyMiB := add1 (div (.Values.app.fileSizeLimit | int) 1048576) -}}
{{- $_ := set $annotations "nginx.ingress.kubernetes.io/proxy-body-size" (printf "%dm" $bodyMiB) -}}
{{- $paths := list
  (dict "path" "/api" "service" (printf "%s-api" $fullName) "port" .Values.api.service.port)
  (dict "path" "/auth" "service" (printf "%s-api" $fullName) "port" .Values.api.service.port)
  (dict "path" "/static" "service" (printf "%s-api" $fullName) "port" .Values.api.service.port)
  (dict "path" "/live" "service" (printf "%s-live" $fullName) "port" .Values.live.service.port)
  (dict "path" "/spaces" "service" (printf "%s-space" $fullName) "port" .Values.space.service.port)
  (dict "path" "/god-mode" "service" (printf "%s-admin" $fullName) "port" .Values.admin.service.port)
-}}
{{- if .Values.objectStorage.serviceName }}
{{- $paths = append $paths (dict "path" (printf "/%s" .Values.objectStorage.bucket) "service" .Values.objectStorage.serviceName "port" .Values.objectStorage.servicePort) }}
{{- end }}
{{- $paths = append $paths (dict "path" "/" "service" (printf "%s-web" $fullName) "port" .Values.web.service.port) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "plane.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls.secretName }}
  tls:
    - hosts:
        - {{ $.Values.ingress.host | quote }}
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
          {{- range $paths }}
          - path: {{ .path }}
            pathType: Prefix
            backend:
              service:
                name: {{ .service }}
                port:
                  number: {{ .port }}
          {{- end }}
{{- end }}
