ingress:
  enabled: true

  annotations:
    {{- if .Emporium.Annotations }}
    {{- toYaml .Emporium.Annotations | nindent 4 }}
    {{- end }}
    kubernetes.io/tls-acme: "true"

  host: {{ .Emporium.Integrations.DNS.Hostname }}
  tls:
    secretName: plane-tls
    host: {{ .Emporium.Integrations.DNS.Hostname }}

smtp:
  enabled: true
  host: {{ .Emporium.Integrations.SMTP.Host }}
  username: {{ .Emporium.Integrations.SMTP.Username | quote }}
  password: {{ .Emporium.Integrations.SMTP.Password | quote }}
  port: {{ .Emporium.Integrations.SMTP.Port | quote }}
  from: {{ .Emporium.Integrations.SMTP.From | quote }}

database:
  host: {{ .Emporium.Integrations.Postgres.Host | quote }}
  port: {{ .Emporium.Integrations.Postgres.Port }}
  name: {{ .Emporium.Integrations.Postgres.Database | quote }}
  existingSecret: {{ .Emporium.Integrations.Postgres.SecretName | quote }}
  usernameKey: {{ .Emporium.Integrations.Postgres.UsernameKey | quote }}
  passwordKey: {{ .Emporium.Integrations.Postgres.PasswordKey | quote }}
  uriKey: {{ .Emporium.Integrations.Postgres.URIKey | quote }}
