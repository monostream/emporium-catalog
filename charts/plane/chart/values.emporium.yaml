ingress:
  enabled: true

{{- with .Emporium.Integrations.uploads }}
{{- $s3 := urlParse .Endpoint }}
objectStorage:
  bucket: {{ first .Buckets | quote }}
  # The S3 Service the provider created; the ingress serves presigned URLs at /<bucket>.
  serviceName: {{ splitList "." $s3.hostname | first | quote }}
  servicePort: {{ splitList ":" $s3.host | last | atoi }}
{{- end }}

{{- with .Emporium.Integrations.mail }}
smtp:
  enabled: true
  host: {{ .Host | quote }}
  port: {{ .Port }}
  username: {{ .Username | quote }}
  from: {{ .From | quote }}
  useSSL: {{ eq (int .Port) 465 }}
  existingSecret: {{ .SecretName | quote }}
  passwordKey: {{ .PasswordKey | quote }}
{{- end }}
