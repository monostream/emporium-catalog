# Default values for plane (Community Edition).
# Emporium fills the connection values (database, redis, object storage, secrets,
# ingress, SMTP) in values.emporium.yaml; outside Emporium set them yourself.

# Backend: Django API, Celery worker, Celery beat and the migration Job share this image.
api:
  image:
    repository: makeplane/plane-backend
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  replicaCount: 1
  # Gunicorn workers per API pod; each needs about 300 MiB.
  gunicornWorkers: 1
  service:
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

worker:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

# Celery beat schedules periodic tasks; it must run exactly once.
beat:
  resources:
    requests:
      cpu: 20m
      memory: 192Mi
    limits:
      memory: 384Mi

migrator:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

web:
  image:
    repository: makeplane/plane-frontend
    pullPolicy: IfNotPresent
    tag: ""
  replicaCount: 1
  service:
    port: 3000
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

space:
  image:
    repository: makeplane/plane-space
    pullPolicy: IfNotPresent
    tag: ""
  replicaCount: 1
  service:
    port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi

admin:
  image:
    repository: makeplane/plane-admin
    pullPolicy: IfNotPresent
    tag: ""
  replicaCount: 1
  service:
    port: 3000
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# Real-time collaboration server for Pages.
live:
  image:
    repository: makeplane/plane-live
    pullPolicy: IfNotPresent
    tag: ""
  service:
    port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

app:
  # Seeds the instance setting "allow sign-ups" on the first start; change it later in /god-mode.
  enableSignup: false
  # Maximum upload size in bytes (Plane default 5 MiB). The ingress body limit follows it.
  fileSizeLimit: 5242880

# Secret holding SECRET_KEY and LIVE_SERVER_SECRET_KEY.
secrets:
  existingSecret: ""

# PostgreSQL database (the CloudNativePG app secret in Emporium).
database:
  host: ""
  port: 5432
  name: plane
  existingSecret: ""
  usernameKey: username
  passwordKey: password
  uriKey: uri

# Redis for the Django cache and the live server. urlKey holds a redis:// URL including the password.
redis:
  existingSecret: ""
  urlKey: REDIS_URL

# Separate Redis for the Celery broker (the API flushes the cache Redis at every start).
queue:
  existingSecret: ""
  urlKey: QUEUE_URL

# S3 bucket for uploads, served through the ingress at /<bucket>.
objectStorage:
  endpoint: ""
  region: us-east-1
  bucket: uploads
  # In-cluster Service of the S3 endpoint (ingress backend for /<bucket>).
  serviceName: ""
  servicePort: 9000
  existingSecret: ""
  accessKeyKey: ""
  secretKeyKey: ""

smtp:
  enabled: false
  host: ""
  port: 587
  username: ""
  from: ""
  # Implicit TLS (port 465) instead of STARTTLS.
  useSSL: false
  existingSecret: ""
  passwordKey: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls:
    secretName: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
