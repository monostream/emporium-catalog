{{- range $name, $p := dict "config" .Values.persistence.config "library" .Values.persistence.library "ingest" .Values.persistence.ingest }}
{{- if not $p.existingClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "chart.fullname" $ }}-{{ $name }}
  labels:
    {{- include "chart.labels" $ | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ $p.size }}
{{- end }}
{{- end }}
