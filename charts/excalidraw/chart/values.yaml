# Default values for excalidraw.

replicaCount: 1

image:
  repository: excalidraw/excalidraw
  pullPolicy: IfNotPresent
  # Excalidraw publishes only `latest` (the sha-* tags stopped in 2021), so the image is pinned by
  # digest: `latest` as of 2026-05-06. The digest wins over the tag when set.
  tag: "latest"
  digest: "sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

# The image is stock nginx: the master process starts as root on port 80 and drops to the nginx
# user for its workers. Keep only the capabilities that needs.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
    add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
