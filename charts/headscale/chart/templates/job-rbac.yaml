apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "chart.fullname" . }}-job-sa
  labels:
    {{- include "chart.labels" . | nindent 4 }}

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "chart.fullname" . }}-job-role
  labels:
    {{- include "chart.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Pod names are generated, so exec cannot be limited by resourceNames. The namespace holds only this
  # app (Emporium installs one release per namespace), and the job's pod runs only this script.
  # kubectl >= 1.31 runs exec over WebSocket, which needs `create` (older SPDY used `get`).
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ include "chart.fullname" . }}-root-api-key"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["{{ include "chart.fullname" . }}"]
    verbs: ["patch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "chart.fullname" . }}-job-rolebinding
  labels:
    {{- include "chart.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "chart.fullname" . }}-job-sa
roleRef:
  kind: Role
  name: {{ include "chart.fullname" . }}-job-role
  apiGroup: rbac.authorization.k8s.io
