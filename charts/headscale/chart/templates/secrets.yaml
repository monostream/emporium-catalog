{{- /*
Holds ROOT_API_KEY, which the post-install job creates in headscale and patches in.
The chart renders no data on purpose: Helm's three-way merge then never removes the
key the job added, and the chart needs no cluster read.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart.fullname" . }}-root-api-key
  labels:
    {{- include "chart.labels" . | nindent 4 }}
type: Opaque
