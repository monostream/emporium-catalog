apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "chart.fullname" . }}-post-install
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "chart.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "chart.fullname" . }}-job-sa
      containers:
        - name: post-install
          image: {{ .Values.job.image }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          command:
            - /bin/sh
            - -c
            - |
              set -e

              # Wait for the headscale container only: Headplane (same pod) cannot start
              # without the API key this job creates, so the pod is not Ready yet.
              for i in $(seq 1 90); do
                READY=$(kubectl get pods -l app.kubernetes.io/name={{ include "chart.name" . }},app.kubernetes.io/instance={{ .Release.Name }} \
                  -o jsonpath='{.items[0].status.containerStatuses[?(@.name=="{{ .Chart.Name }}")].ready}' 2>/dev/null || echo "")
                [ "$READY" = "true" ] && break
                sleep 5
              done

              SECRET_NAME="{{ include "chart.fullname" . }}-root-api-key"

              # Check if ROOT_API_KEY is set
              ROOT_API_KEY=$(kubectl get secret $SECRET_NAME -o jsonpath="{.data.ROOT_API_KEY}" 2>/dev/null || echo "")

              if [ -z "$ROOT_API_KEY" ]; then
                echo "ROOT_API_KEY is not set. Generating new API key."

                # Get the pod name
                POD_NAME=$(kubectl get pods -l app.kubernetes.io/name={{ include "chart.name" . }},app.kubernetes.io/instance={{ .Release.Name }} -o jsonpath="{.items[0].metadata.name}")

                # Exec into the pod; headscale needs a moment after the container starts, so retry.
                API_KEY=""
                for i in $(seq 1 30); do
                  OUT=$(kubectl exec $POD_NAME -c {{ .Chart.Name }} -- headscale apikeys create --expiration 30000d 2>/tmp/exec.err | tail -n1 | tr -d '\r' || true)
                  case "$OUT" in hskey-api-*) API_KEY="$OUT"; break;; esac
                  sleep 5
                done
                if [ -z "$API_KEY" ]; then
                  echo "could not create a headscale API key: $(tail -n 3 /tmp/exec.err 2>/dev/null)" >&2
                  exit 1
                fi

                # Update the secret
                kubectl patch secret $SECRET_NAME -p "{\"data\": {\"ROOT_API_KEY\": \"$(echo -n $API_KEY | base64 | tr -d '\n')\"}}"

                # Restart so Headplane picks the key up (it also retries on its own)
                kubectl rollout restart deployment/{{ include "chart.fullname" . }}

              else
                echo "ROOT_API_KEY is already set."
              fi
      restartPolicy: OnFailure
