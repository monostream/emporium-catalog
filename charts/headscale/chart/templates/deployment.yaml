apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "chart.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "chart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: init-socket-permissions
          image: busybox
          command: ['sh', '-c']
          args:
            - |
              mkdir -p /var/run/headscale
              chmod 0770 /var/run/headscale
          volumeMounts:
            - name: headscale-socket
              mountPath: /var/run/headscale
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          args: ["serve"]
          {{- if .Values.oidc.existingSecret }}
          env:
            - name: HEADSCALE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.existingSecret | quote }}
                  key: {{ .Values.oidc.clientSecretKey | quote }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /data
              name: data
            - name: config
              mountPath: /etc/headscale
            - name: headscale-socket
              mountPath: /var/run/headscale
        - name: {{ .Chart.Name }}-web
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          env:
          # Headplane 0.7 reads /etc/headplane/config.yaml; the HEADPLANE_* variables below
          # override it (HEADPLANE_LOAD_ENV_OVERRIDES) and carry the secrets by reference.
          - name: HEADPLANE_LOAD_ENV_OVERRIDES
            value: 'true'
          {{- with .Values.cookie.existingSecret }}
          - name: HEADPLANE_SERVER__COOKIE_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ . | quote }}
                key: COOKIE_SECRET
          {{- end }}
          {{- if .Values.oidc.existingSecret }}
          - name: HEADPLANE_OIDC__CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ .Values.oidc.existingSecret | quote }}
                key: {{ .Values.oidc.clientSecretKey | quote }}
          {{- end }}
          - name: HEADPLANE_HEADSCALE__API_KEY
            valueFrom:
              secretKeyRef:
                name: {{ include "chart.fullname" . }}-root-api-key
                key: ROOT_API_KEY
                # Filled by the post-install job once headscale runs; Headplane restarts until it exists.
                optional: true
          ports:
            - name: web
              containerPort: {{ .Values.web.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /var/lib/headplane
              name: data
              subPath: headplane
            - name: config
              mountPath: /etc/headscale
            - name: headplane-config
              mountPath: /etc/headplane
      volumes:
      - name: headplane-config
        configMap:
          name: {{ template "chart.fullname" . }}-headplane
      - name: headscale-socket
        emptyDir: {}
      - name: config
        configMap:
          name: {{ template "chart.fullname" . }}
      - name: data
        {{- if and .Values.storage.data.enabled .Values.storage.data.existingClaim }}
        persistentVolumeClaim:
          claimName: {{ .Values.storage.data.existingClaim }}
        {{- else if .Values.storage.data.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "chart.fullname" . }}-data
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
