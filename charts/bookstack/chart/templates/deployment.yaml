{{- $image := printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Migrations run at start and the upload volume is ReadWriteOnce.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chart.labels" . | nindent 8 }}
      {{- if .Values.admin.existingSecret }}
      annotations:
        checksum/bootstrap: {{ include (print $.Template.BasePath "/bootstrap-configmap.yaml") . | sha256sum }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.admin.existingSecret }}
      # Runs the database migrations (which seed admin@admin.com / password), then replaces that
      # account, before the web server starts: the public default login is never reachable.
      initContainers:
        - name: bootstrap
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - bash
            - -c
            - |
              set -e
              for i in $(seq 1 90); do
                (echo > /dev/tcp/{{ include "chart.mariadb.fullname" . }}/3306) >/dev/null 2>&1 && break
                sleep 2
              done
              sleep 2
              php artisan migrate --force
              php /bootstrap/bootstrap.php
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- include "chart.env" . | nindent 12 }}
            - name: ADMIN_NAME
              value: {{ .Values.admin.name | quote }}
            - name: ADMIN_EMAIL
              value: {{ .Values.admin.email | quote }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.existingSecret | quote }}
                  key: {{ .Values.admin.passwordKey | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            {{- include "chart.uploadMounts" . | nindent 12 }}
      {{- end }}
      containers:
        - name: bookstack
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- include "chart.env" . | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          # The entrypoint waits for the database and migrates before Apache listens.
          startupProbe:
            httpGet: { path: /status, port: http }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /status, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "chart.uploadMounts" . | nindent 12 }}
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-uploads" (include "chart.fullname" .)) }}
        {{- if .Values.admin.existingSecret }}
        - name: bootstrap
          configMap:
            name: {{ include "chart.fullname" . }}-bootstrap
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
