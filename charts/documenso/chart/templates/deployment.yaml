apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "chart.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "chart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
          - name: PORT
            value: "3000"
          - name: NEXTAUTH_URL
            value: {{ .Values.app.domain | quote }}
          - name: NEXT_PUBLIC_WEBAPP_URL
            value: {{ .Values.app.domain | quote }}
          - name: NEXT_PRIVATE_INTERNAL_WEBAPP_URL
            value: "http://localhost:3000"
          {{- $app := required "app.existingSecret is required" .Values.app.existingSecret }}
          {{- range list "NEXTAUTH_SECRET" "NEXT_PRIVATE_ENCRYPTION_KEY" "NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY" }}
          - name: {{ . }}
            valueFrom:
              secretKeyRef:
                name: {{ $app }}
                key: {{ . }}
          {{- end }}
          {{- range list "NEXT_PRIVATE_SIGNING_LOCAL_FILE_CONTENTS" "NEXT_PRIVATE_SIGNING_PASSPHRASE" }}
          - name: {{ . }}
            valueFrom:
              secretKeyRef:
                name: {{ $app }}
                key: {{ . }}
                optional: true
          {{- end }}
          - name: NEXT_PRIVATE_DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: {{ required "database.existingSecret is required" .Values.database.existingSecret }}
                key: {{ .Values.database.uriKey }}
          {{- with .Values.app.smtp }}
          {{- if .host }}
          - name: NEXT_PRIVATE_SMTP_TRANSPORT
            value: smtp-auth
          - name: NEXT_PRIVATE_SMTP_HOST
            value: {{ .host | quote }}
          - name: NEXT_PRIVATE_SMTP_PORT
            value: {{ .port | quote }}
          - name: NEXT_PRIVATE_SMTP_FROM_ADDRESS
            value: {{ .from | quote }}
          - name: NEXT_PRIVATE_SMTP_FROM_NAME
            value: {{ .fromName | quote }}
          - name: NEXT_PRIVATE_SMTP_USERNAME
            value: {{ .username | quote }}
          {{- if .existingSecret }}
          - name: NEXT_PRIVATE_SMTP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .existingSecret }}
                key: {{ .passwordKey }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- with .Values.app.oidc }}
          {{- if .wellknownUrl }}
          - name: NEXT_PRIVATE_OIDC_WELL_KNOWN
            value: {{ .wellknownUrl | quote }}
          - name: NEXT_PRIVATE_OIDC_CLIENT_ID
            value: {{ .clientId | quote }}
          - name: NEXT_PRIVATE_OIDC_PROVIDER_LABEL
            value: {{ .providerLabel | quote }}
          {{- if .existingSecret }}
          - name: NEXT_PRIVATE_OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ .existingSecret }}
                key: {{ .clientSecretKey }}
          {{- end }}
          {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # Prisma migrations run before the server listens.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          # /api/health also checks the database; a database outage should not restart the pod.
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
