# Default values for documenso.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: documenso/documenso
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

app:
  domain: "https://localhost"
  # Secret with NEXTAUTH_SECRET, NEXT_PRIVATE_ENCRYPTION_KEY and
  # NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY, optionally
  # NEXT_PRIVATE_SIGNING_LOCAL_FILE_CONTENTS and NEXT_PRIVATE_SIGNING_PASSPHRASE.
  existingSecret: ""
  smtp:
    host: ""
    port: 587
    from: ""
    fromName: Documenso
    username: ""
    # Secret and key holding the SMTP password.
    existingSecret: ""
    passwordKey: password
  oidc:
    wellknownUrl: ""
    clientId: ""
    providerLabel: Emporium
    # Secret and key holding the OIDC client secret.
    existingSecret: ""
    clientSecretKey: clientSecret

# PostgreSQL database. Emporium provides it with its postgres integration
# (CloudNativePG) and fills these values in values.emporium.yaml.
database:
  # Secret holding a postgresql:// connection URI.
  existingSecret: ""
  uriKey: uri

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  # capabilities:
  #   drop:
  #   - ALL
  #readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 1Gi

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
