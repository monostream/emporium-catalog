app:
  domain: {{ printf "https://%s" .Emporium.Integrations.web.Hostname | quote }}
  existingSecret: {{ .Emporium.Secrets.Name | quote }}
  smtp:
    host: {{ .Emporium.Integrations.mail.Host | quote }}
    port: {{ .Emporium.Integrations.mail.Port }}
    from: {{ .Emporium.Integrations.mail.From | quote }}
    username: {{ .Emporium.Integrations.mail.Username | quote }}
    existingSecret: {{ .Emporium.Integrations.mail.SecretName | quote }}
    passwordKey: {{ .Emporium.Integrations.mail.PasswordKey | quote }}
  oidc:
    wellknownUrl: {{ .Emporium.Integrations.oidc.ConfigurationEndpoint | quote }}
    clientId: {{ .Emporium.Integrations.oidc.ClientID | quote }}
    existingSecret: {{ .Emporium.Integrations.oidc.SecretName | quote }}
    clientSecretKey: {{ .Emporium.Integrations.oidc.ClientSecretKey | quote }}

database:
  existingSecret: {{ .Emporium.Integrations.postgres.EnvSecretName | quote }}
  uriKey: NEXT_PRIVATE_DATABASE_URL

ingress:
  enabled: true
  annotations: {{ .Emporium.Integrations.web.Annotations | toJson }}
  hosts:
    - host: {{ .Emporium.Integrations.web.Hostname | quote }}
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: {{ .Emporium.Integrations.web.TLSSecretName | quote }}
      hosts: {{ .Emporium.Integrations.web.AllHosts | toJson }}
