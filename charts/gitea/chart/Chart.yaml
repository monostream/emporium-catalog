apiVersion: v2
name: gitea
description: Gitea is a community managed lightweight code hosting solution written in Go. It is published under the MIT license.
type: application
version: 0.1.0
appVersion: "1.27.0"
dependencies:
  - name: gitea
    version: 12.7.0
    repository: https://dl.gitea.io/charts/
home: https://gitea.com/
icon: https://raw.githubusercontent.com/monostream/test-charts/main/assets/gitea/gitea_icon_2.svg
sources:
  - https://gitea.com/gitea/helm-chart
keywords:
  - Collaboration
  - Coding
  - Git
  - CI/CD
  - Issue Tracking
annotations:
  icon: assets/icon.svg
  category: Developer Tools
  displayName: Gitea
  licenses: MIT
  emporiumVersion: v0.5.0
  emporium.build/postgres: |
    database: gitea
    owner: gitea
    version: "17"
    storage: 10Gi
