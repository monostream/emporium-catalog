apiVersion: emporium.build/v1

sections:
  - { id: general, label: General }
  - { id: admin, label: Administration, description: "Grist has no local accounts: people sign in with their Emporium account, identified by email." }

inputs:
  AdminEmail:
    label: Administrator email
    description: The Emporium user with this email becomes the Grist administrator (Admin Panel, installation settings) at the first sign-in. Leave empty for no administrator.
    type: string
    pattern: '^$|^[^\s@]+@[^\s@]+\.[^\s@]+$'
    section: admin
    path: config.adminEmail
  SandboxFlavor:
    label: Formula sandbox
    description: "Where spreadsheet formulas (Python) run. Pyodide isolates them in WebAssembly without extra privileges. Unsandboxed runs them as the Grist process: choose it only if every user is trusted."
    type: enum
    options: [pyodide, unsandboxed]
    default: pyodide
    path: config.sandboxFlavor
  SessionSecret:
    label: Session secret
    description: Signs the login cookies. Generated once.
    type: secret
    generate: { length: 48, charset: alnum }
    section: admin
    ref: { namePath: secrets.existingSecret, keyPath: secrets.sessionSecretKey, key: SessionSecret }
  BootKey:
    label: Boot key
    description: "Break-glass: sent as the x-boot-key header it authenticates API calls as the installation administrator. Generated once; read it from the app's Secret."
    type: secret
    generate: { length: 32, charset: alnum }
    section: admin
    ref: { namePath: secrets.existingSecret, keyPath: secrets.bootKeyKey, key: BootKey }

integrations:
  web:
    type: ingress
    access: { default: authenticated }
    # The REST API (also under /o/<site>/api) and the document download/attachment
    # endpoints use API keys or share links, not the browser session.
    skipPaths: ["/api/*", "regex(^/o/[^/]+/api/.*)"]
    # Grist's own OpenID Connect login.
    redirectPaths: [/oauth2/callback]
    bind:
      Hostname: ingress.host
      Annotations: ingress.annotations
      TLSSecretName: ingress.tlsSecretName
      IngressClassName: ingress.className
  sso:
    type: oidc
  data:
    type: storage
    size: { default: 5Gi, growOnly: true }
    bind:
      ClaimName: persistence.existingClaim

components:
  app:
    label: Grist
    resources: resources
    replicas: { fixed: 1, reason: "SQLite home database and documents on a ReadWriteOnce volume" }

profiles:
  default: small
  small:
    label: Small
    description: A household or a team of a few dozen people
    values: profiles/small.yaml
