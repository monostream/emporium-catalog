# Base configuration. Renders on its own; Emporium fills the connection values
# through emporium.yaml (bind, inputs) and values.emporium.yaml.
nameOverride: ""
fullnameOverride: ""

image:
  repository: gristlabs/grist
  tag: "1.7.21"
  pullPolicy: IfNotPresent

service:
  port: 8484

config:
  # Public URL of the instance (APP_HOME_URL), e.g. https://grist.example.com
  baseUrl: ""
  # Where spreadsheet formulas run. "pyodide" (WebAssembly) needs no privileges;
  # "gvisor" is stronger but needs an unconfined pod; "unsandboxed" runs formulas
  # as the Grist process and is only safe when every user is trusted.
  sandboxFlavor: pyodide
  # Email of the Grist installation administrator (Admin Panel). That person must
  # sign in with this email. Empty: a non-routable placeholder, so nobody is administrator
  # (an unset value would make Grist's support account the administrator).
  adminEmail: ""
  # Refuse anonymous visitors (also on the Grist side, behind the Emporium login).
  forceLogin: true

# Secrets generated by Emporium (per-app Secret). The session secret signs the
# login cookies; the boot key lets an operator act as administrator through the
# API (x-boot-key header) when single sign-on is unavailable.
secrets:
  existingSecret: ""
  sessionSecretKey: SessionSecret
  bootKeyKey: BootKey

# OpenID Connect login.
oidc:
  enabled: false
  issuer: ""
  clientId: ""
  # Secret and key holding the client secret.
  existingSecret: ""
  clientSecretKey: clientSecret

# Data: /persist holds the home database (SQLite) and the .grist documents.
persistence:
  # Claim bound by the `data` storage integration.
  existingClaim: ""

# Additional environment variables (see the Grist README, "Environment variables").
extraEnv: []

# Filled by Emporium through the `web` ingress integration.
ingress:
  enabled: true
  className: ""
  host: ""
  annotations: {}
  tlsSecretName: ""
  tlsHosts: []

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1536Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
