gha-runner-scale-set-controller:
  serviceAccount:
    name: {{ printf "%s-gha-runner-scale-set-controller" .Emporium.Name | quote }}
  flags:
    # Only this install's runner scale set, so several installs do not fight over each other's.
    watchSingleNamespace: {{ .Emporium.Namespace | quote }}

gha-runner-scale-set:
  controllerServiceAccount:
    namespace: {{ .Emporium.Namespace | quote }}
    name: {{ printf "%s-gha-runner-scale-set-controller" .Emporium.Name | quote }}
