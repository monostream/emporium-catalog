apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-crd-manager
  labels:
    app.kubernetes.io/managed-by: "Helm"
  annotations:
    meta.helm.sh/release-name: "{{ .Release.Name }}"
    meta.helm.sh/release-namespace: "{{ .Release.Namespace }}"
    helm.sh/hook: "pre-upgrade"
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: "before-hook-creation"
rules:
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["create", "get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-crd-manager-binding
  labels:
    app.kubernetes.io/managed-by: "Helm"
  annotations:
    meta.helm.sh/release-name: "{{ .Release.Name }}"
    meta.helm.sh/release-namespace: "{{ .Release.Namespace }}"
    helm.sh/hook: "pre-upgrade"
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: "before-hook-creation"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-crd-manager
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-gha-runner-scale-set-controller
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-gha-runner-deployment-scaler
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: "Helm"
  annotations:
    meta.helm.sh/release-name: "{{ .Release.Name }}"
    meta.helm.sh/release-namespace: "{{ .Release.Namespace }}"
    helm.sh/hook: "pre-upgrade"
    helm.sh/hook-weight: "5"  
    helm.sh/hook-delete-policy: "before-hook-creation"
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/scale"]
  verbs: ["update", "patch", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-gha-runner-deployment-scaler-binding
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: "Helm"
  annotations:
    meta.helm.sh/release-name: "{{ .Release.Name }}"
    meta.helm.sh/release-namespace: "{{ .Release.Namespace }}"
    helm.sh/hook: "pre-upgrade"
    helm.sh/hook-weight: "5" 
    helm.sh/hook-delete-policy: "before-hook-creation"
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-gha-runner-scale-set-controller
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-gha-runner-deployment-scaler
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-gha-runner-pre-upgrade-job
  labels:
    app.kubernetes.io/component: pre-upgrade-job
    app.kubernetes.io/managed-by: "Helm"
  annotations:
    meta.helm.sh/release-name: "{{ .Release.Name }}"
    meta.helm.sh/release-namespace: "{{ .Release.Namespace }}"
    helm.sh/hook: "pre-upgrade"
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/component: pre-upgrade-job
    spec:
      serviceAccountName: {{ .Release.Name }}-gha-runner-scale-set-controller
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      {{- $crds := printf "https://raw.githubusercontent.com/actions/actions-runner-controller/gha-runner-scale-set-%s/charts/gha-runner-scale-set-controller/crds" .Chart.AppVersion }}
      initContainers:
        # The CRDs of the bundled controller version (the wrapper's appVersion)
        - name: apply-crds
          image: {{ .Values.crdUpgrade.image | quote }}
          args:
            - apply
            - --server-side
            - --force-conflicts
            {{- range list "autoscalinglisteners" "autoscalingrunnersets" "ephemeralrunners" "ephemeralrunnersets" }}
            - --filename={{ printf "%s/actions.github.com_%s.yaml" $crds . }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
      containers:
        - name: scale-down-controller
          image: {{ .Values.crdUpgrade.image | quote }}
          args:
            - scale
            - {{ printf "deployment/%s-gha-rs-controller" .Release.Name }}
            - --replicas=0
            - {{ printf "--namespace=%s" .Release.Namespace }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
