{{- $flags := list "disable-demo-users" "disable-demo-warning" "enable-login-with-oidc" -}}
{{- if input "Registration" | eq "true" }}{{ $flags = concat $flags (list "enable-registration" "enable-oidc-registration") }}{{ else }}{{ $flags = append $flags "disable-registration" }}{{ end -}}
{{- if input "PasswordLogin" | eq "true" }}{{ $flags = append $flags "enable-login-with-password" }}{{ else }}{{ $flags = append $flags "disable-login-with-password" }}{{ end -}}
{{- if .Emporium.Integrations.mail }}{{ $flags = append $flags "enable-smtp" }}{{ else }}{{ $flags = append $flags "disable-email-verification" }}{{ end }}
config:
  publicURI: {{ printf "https://%s" .Emporium.Integrations.web.Hostname | quote }}
  flags: {{ join " " $flags | quote }}

  postgresql:
    host: {{ .Emporium.Integrations.postgres.Host | quote }}
    port: {{ .Emporium.Integrations.postgres.Port }}
    database: {{ .Emporium.Integrations.postgres.Database | quote }}
    username: {{ .Emporium.Integrations.postgres.Username | quote }}
    existingSecret: {{ .Emporium.Integrations.postgres.SecretName | quote }}
    passwordKey: {{ .Emporium.Integrations.postgres.PasswordKey | quote }}
    # Verified TLS against the CloudNativePG CA (Host is the -rw.<ns>.svc name in the certificate).
    caSecret: {{ .Emporium.Integrations.postgres.CASecretName | quote }}

  redis:
    existingSecret: {{ .Emporium.Integrations.redis.SecretName | quote }}
    uriKey: PENPOT_REDIS_URI

  objectStorage:
    endpoint: {{ .Emporium.Integrations.assets.Endpoint | quote }}
    region: {{ .Emporium.Integrations.assets.Region | quote }}
    bucket: {{ first .Emporium.Integrations.assets.Buckets | quote }}
    existingSecret: {{ .Emporium.Integrations.assets.SecretName | quote }}
    accessKeyKey: {{ .Emporium.Integrations.assets.AccessKeyKey | quote }}
    secretKeyKey: {{ .Emporium.Integrations.assets.SecretKeyKey | quote }}

  {{- with .Emporium.Integrations.mail }}
  smtp:
    enabled: true
    host: {{ .Host | quote }}
    port: {{ .Port }}
    defaultFrom: {{ .From | quote }}
    defaultReplyTo: {{ .ReplyTo | quote }}
    username: {{ .Username | quote }}
    existingSecret: {{ .SecretName | quote }}
    passwordKey: {{ .PasswordKey | quote }}
  {{- end }}

  oidc:
    enabled: true
    baseURI: {{ .Emporium.Integrations.oidc.Issuer | quote }}
    clientID: {{ .Emporium.Integrations.oidc.ClientID | quote }}
    existingSecret: {{ .Emporium.Integrations.oidc.SecretName | quote }}
    clientSecretKey: {{ .Emporium.Integrations.oidc.ClientSecretKey | quote }}

frontend:
  ingress:
    enabled: true
    annotations: {{ .Emporium.Integrations.web.Annotations | toJson }}
    hosts:
      - host: {{ .Emporium.Integrations.web.Hostname | quote }}
    tls:
      - secretName: {{ .Emporium.Integrations.web.TLSSecretName | quote }}
        hosts: {{ .Emporium.Integrations.web.AllHosts | toJson }}
