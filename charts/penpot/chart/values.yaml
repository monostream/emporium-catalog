global:
  imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
# Cluster DNS domain. The frontend's nginx resolves the object storage host
# without search domains, so a "<svc>.<ns>.svc" endpoint gets this suffix.
clusterDomain: cluster.local

config:
  publicURI: http://localhost:8080
  flags: enable-registration enable-login-with-password disable-demo-users disable-demo-warning disable-email-verification
  # Secret holding the Penpot secret key (signs sessions and tokens).
  # Empty: Penpot generates a random key at every start (sessions end on restart).
  existingSecret: ""
  secretKeyKey: PENPOT_SECRET_KEY
  telemetryEnabled: true
  registrationDomainWhitelist: ""

  postgresql:
    host: postgresql
    port: 5432
    database: penpot
    username: penpot
    # Secret with the password (key passwordKey).
    existingSecret: ""
    passwordKey: password
    # Secret with the server CA (key ca.crt): TLS with certificate verification
    # (sslmode=verify-full). Empty: the driver default (sslmode=prefer).
    caSecret: ""

  redis:
    # Secret holding the full redis:// URI under uriKey. Empty: uri below.
    existingSecret: ""
    uriKey: PENPOT_REDIS_URI
    uri: redis://redis:6379/0

  # S3 object storage for uploaded assets and files (required). The frontend
  # proxies the backend's presigned redirects, so the endpoint may be in-cluster.
  objectStorage:
    endpoint: ""
    region: us-east-1
    bucket: penpot
    # Secret with the access key and secret key.
    existingSecret: ""
    accessKeyKey: accessKey
    secretKeyKey: secretKey

  smtp:
    enabled: false
    host: ""
    port: 587
    defaultFrom: ""
    defaultReplyTo: ""
    username: ""
    # Secret with the SMTP password (key passwordKey).
    existingSecret: ""
    passwordKey: password

  oidc:
    enabled: false
    # Issuer; Penpot reads <baseURI>/.well-known/openid-configuration.
    baseURI: ""
    clientID: ""
    # Secret with the client secret (key clientSecretKey).
    existingSecret: ""
    clientSecretKey: clientSecret

backend:
  replicaCount: 1
  image:
    repository: penpotapp/backend
    tag: ""
    imagePullPolicy: IfNotPresent
  # The JVM sizes its heap from the container memory limit.
  jvmOpts: -XX:MaxRAMPercentage=60
  podSecurityContext:
    enabled: true
    fsGroup: 1001
  containerSecurityContext:
    enabled: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 1001
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi
  service:
    port: 6060
    type: ClusterIP
  nodeSelector: {}
  affinity: {}
  tolerations: []

exporter:
  replicaCount: 1
  image:
    repository: penpotapp/exporter
    tag: ""
    imagePullPolicy: IfNotPresent
  podSecurityContext:
    enabled: true
    fsGroup: 1001
  containerSecurityContext:
    enabled: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 1001
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  service:
    port: 6061
    type: ClusterIP
  nodeSelector: {}
  affinity: {}
  tolerations: []

frontend:
  replicaCount: 1
  image:
    repository: penpotapp/frontend
    tag: ""
    imagePullPolicy: IfNotPresent
  podSecurityContext:
    enabled: true
    fsGroup: 1001
  containerSecurityContext:
    enabled: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 1001
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  service:
    port: 80
    type: ClusterIP
  ingress:
    enabled: false
    className: ""
    annotations:
      # Penpot accepts uploads up to 350 MiB (frontend nginx default).
      nginx.ingress.kubernetes.io/proxy-body-size: 350m
    hosts: []
    tls: []
  nodeSelector: {}
  affinity: {}
  tolerations: []

serviceAccount:
  enabled: true
  annotations: {}
  name: ""
