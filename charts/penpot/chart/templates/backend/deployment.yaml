{{- $pg := .Values.config.postgresql -}}
{{- $s3 := .Values.config.objectStorage -}}
{{- $smtp := .Values.config.smtp -}}
{{- $oidc := .Values.config.oidc -}}
{{- $_ := required "config.objectStorage.endpoint is required" $s3.endpoint -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "penpot.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "penpot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "penpot.backendSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "penpot.backendSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "penpot.serviceAccountName" . }}
      {{- include "penpot.podSecurityContext" .Values.backend.podSecurityContext | nindent 6 }}
      containers:
        - name: {{ .Chart.Name }}-backend
          {{- if .Values.backend.containerSecurityContext.enabled }}
          securityContext:
            {{- omit .Values.backend.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.imagePullPolicy }}
          env:
            - name: PENPOT_PUBLIC_URI
              value: {{ .Values.config.publicURI | quote }}
            - name: PENPOT_FLAGS
              value: {{ .Values.config.flags | quote }}
            - name: JVM_OPTS
              value: {{ .Values.backend.jvmOpts | quote }}
            {{- include "penpot.secretKeyEnv" . | nindent 12 }}
            - name: PENPOT_DATABASE_URI
              {{- if $pg.caSecret }}
              value: {{ printf "postgresql://%s:%v/%s?sslmode=verify-full&sslrootcert=/etc/penpot/postgres-ca/ca.crt" $pg.host $pg.port $pg.database | quote }}
              {{- else }}
              value: {{ printf "postgresql://%s:%v/%s" $pg.host $pg.port $pg.database | quote }}
              {{- end }}
            - name: PENPOT_DATABASE_USERNAME
              value: {{ $pg.username | quote }}
            {{- if $pg.existingSecret }}
            - name: PENPOT_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $pg.existingSecret | quote }}
                  key: {{ $pg.passwordKey | quote }}
            {{- end }}
            {{- include "penpot.redisEnv" . | nindent 12 }}
            - name: PENPOT_OBJECTS_STORAGE_BACKEND
              value: s3
            - name: PENPOT_OBJECTS_STORAGE_S3_ENDPOINT
              value: {{ include "penpot.s3Endpoint" . | quote }}
            - name: PENPOT_OBJECTS_STORAGE_S3_REGION
              value: {{ $s3.region | quote }}
            - name: PENPOT_OBJECTS_STORAGE_S3_BUCKET
              value: {{ $s3.bucket | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ required "config.objectStorage.existingSecret is required" $s3.existingSecret | quote }}
                  key: {{ $s3.accessKeyKey | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $s3.existingSecret | quote }}
                  key: {{ $s3.secretKeyKey | quote }}
            - name: PENPOT_TELEMETRY_ENABLED
              value: {{ .Values.config.telemetryEnabled | quote }}
            {{- with .Values.config.registrationDomainWhitelist }}
            - name: PENPOT_REGISTRATION_DOMAIN_WHITELIST
              value: {{ . | quote }}
            {{- end }}
            {{- if $smtp.enabled }}
            - name: PENPOT_SMTP_HOST
              value: {{ $smtp.host | quote }}
            - name: PENPOT_SMTP_PORT
              value: {{ $smtp.port | quote }}
            {{- if eq (int $smtp.port) 465 }}
            - name: PENPOT_SMTP_SSL
              value: "true"
            {{- else }}
            - name: PENPOT_SMTP_TLS
              value: "true"
            {{- end }}
            {{- with $smtp.defaultFrom }}
            - name: PENPOT_SMTP_DEFAULT_FROM
              value: {{ . | quote }}
            {{- end }}
            {{- with $smtp.defaultReplyTo }}
            - name: PENPOT_SMTP_DEFAULT_REPLY_TO
              value: {{ . | quote }}
            {{- end }}
            {{- with $smtp.username }}
            - name: PENPOT_SMTP_USERNAME
              value: {{ . | quote }}
            {{- end }}
            {{- if $smtp.existingSecret }}
            - name: PENPOT_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $smtp.existingSecret | quote }}
                  key: {{ $smtp.passwordKey | quote }}
            {{- end }}
            {{- end }}
            {{- if $oidc.enabled }}
            - name: PENPOT_OIDC_BASE_URI
              value: {{ $oidc.baseURI | quote }}
            - name: PENPOT_OIDC_CLIENT_ID
              value: {{ $oidc.clientID | quote }}
            {{- if $oidc.existingSecret }}
            - name: PENPOT_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $oidc.existingSecret | quote }}
                  key: {{ $oidc.clientSecretKey | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /opt/data
            {{- if $pg.caSecret }}
            - name: postgres-ca
              mountPath: /etc/penpot/postgres-ca
              readOnly: true
            {{- end }}
      volumes:
        # Temporary files (exports, imports).
        - name: data
          emptyDir: {}
        {{- if $pg.caSecret }}
        - name: postgres-ca
          secret:
            secretName: {{ $pg.caSecret | quote }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
