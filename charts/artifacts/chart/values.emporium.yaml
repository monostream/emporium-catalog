artifacts:
  hosts:
    domain: {{ .Emporium.Integrations.web.Hostname | quote }}
  auth:
    oidc:
      clientId: {{ .Emporium.Integrations.oidc.ClientID | quote }}
      issuer: {{ .Emporium.Integrations.oidc.Issuer | quote }}
  database:
    existingSecret:
      name: {{ .Emporium.Integrations.postgres.EnvSecretName | quote }}
      key: DATABASE_DSN
  ingress:
    enabled: true
    annotations: {{ .Emporium.Integrations.web.Annotations | toJson }}
    tls:
      secretName: {{ .Emporium.Integrations.web.TLSSecretName | quote }}
