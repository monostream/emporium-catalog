image:
  repository: monostream/devcloud-jenkins
  pullPolicy: Always
  tag: ""
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
# Public URL of Jenkins, e.g. https://jenkins.example.com/
baseUrl:
adminUser: admin
# Secret with the key ADMIN_PASSWORD for the local admin user (created once on first start).
# Without it the chart stores adminPassword (or a random one) in its own Secret.
existingSecret: ""
adminPassword:
# OpenID Connect login. The client secret is read from oidc.existingSecret / oidc.clientSecretKey.
oidc: {}
# clientId: ""
# issuerUrl: ""
# existingSecret: ""
# clientSecretKey: ""
rbac:
  # true: the Jenkins ServiceAccount is bound to cluster-admin (pipelines deploy anywhere).
  # false: it gets the built-in "admin" role in its own namespace (enough for the agent swarm).
  clusterAdmin: true

loop:
  uri: "http://localhost"
devcloud:
  id:
  name:
  service:
    type: ClusterIP
    port: 8000
    annotations: {}
serviceAccount:
  create: true
  name:
service:
  type: ClusterIP
  port: 80
jnlp:
  service:
    type: ClusterIP
    port: 50000
    annotations: {}
ingress:
  enabled: false
  # Leave empty to use the cluster default IngressClass
  ingressClassName: ""
  annotations: {}
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
persistence:
  enabled: true
  existingClaim: ""
  # storageClass: "-"
  accessMode: ReadWriteOnce
  size: 5Gi
  annotations: {}
workspace:
  persistence:
    enabled: true
    existingClaim: ""
    # storageClass: "-"
    accessMode: ReadWriteOnce
    size: 50Gi
    annotations: {}
initVolume:
  repository: busybox
  pullPolicy: Always
  tag: stable
resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    memory: 4Gi

extraEnv: []
nodeSelector: {}
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - jenkins-agent
          topologyKey: kubernetes.io/hostname
        weight: 100
tolerations: []
agent:
  image:
    repository: monostream/devcloud-jenkins-agent
    pullPolicy: Always
    tag: ""
  persistence:
    # storageClass: "-"
    accessMode: ReadWriteOnce
    size: 50Gi
    annotations: {}
  initVolume:
    repository: busybox
    pullPolicy: Always
    tag: stable
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 4Gi
  docker:
    repository: docker
    pullPolicy: Always
    tag: 29.9.1
    persistence:
      # storageClass: "-"
      accessMode: ReadWriteOnce
      size: 50Gi
      annotations: {}
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 8Gi
  nodeSelector: {}
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - jenkins-agent
            topologyKey: kubernetes.io/hostname
          weight: 100
        - podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - jenkins
            topologyKey: kubernetes.io/hostname
          weight: 100
  tolerations: []
