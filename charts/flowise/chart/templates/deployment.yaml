apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "chart.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "chart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: init
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: busybox
          command: ["/bin/sh", "-c"]
          args:
          - |
            mkdir -p /data/
            mkdir -p /data/.flowise
            mkdir -p /data/.flowise/logs
          volumeMounts:
            - mountPath: /data
              name: data

      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
          - name: DATABASE_PATH
            value: /data/.flowise
          - name: APIKEY_PATH
            value: /data/.flowise
          - name: SECRETKEY_PATH
            value: /data/.flowise
          - name: LOG_PATH
            value: /data/.flowise/logs
          - name: BLOB_STORAGE_PATH
            value: /data/.flowise/storage
          {{- with .Values.app.existingSecret }}
          {{- range list "JWT_AUTH_TOKEN_SECRET" "JWT_REFRESH_TOKEN_SECRET" "EXPRESS_SESSION_SECRET" "TOKEN_HASH_SECRET" }}
          - name: {{ . }}
            valueFrom:
              secretKeyRef:
                name: {{ $.Values.app.existingSecret | quote }}
                key: {{ . }}
          {{- end }}
          {{- end }}
          {{- with .Values.database }}
          {{- if .host }}
          - name: DATABASE_TYPE
            value: postgres
          - name: DATABASE_HOST
            value: {{ .host | quote }}
          - name: DATABASE_PORT
            value: {{ .port | quote }}
          - name: DATABASE_NAME
            value: {{ .name | quote }}
          - name: DATABASE_USER
            value: {{ .user | quote }}
          - name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ required "database.existingSecret is required with database.host" .existingSecret | quote }}
                key: {{ .passwordKey | quote }}
          {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /data
              name: data
      volumes:
      - name: data
        {{- if and .Values.storage.data.enabled .Values.storage.data.existingClaim }}
        persistentVolumeClaim:
          claimName: {{ .Values.storage.data.existingClaim }}
        {{- else if .Values.storage.data.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "chart.fullname" . }}-data
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
