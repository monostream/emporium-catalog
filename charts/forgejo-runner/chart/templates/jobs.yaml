{{ if and .Values.runner.config.create (not .Values.runner.config.existingSecret ) }}
{{ $name := (print ( include "forgejo-runner.fullname" . ) "-config-generate") }}
{{ $secretName := (print ( include "forgejo-runner.fullname" . ) "-config") }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/component: config-generate-job
    {{- include "forgejo-runner.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/component: config-generate-job
    {{- include "forgejo-runner.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - {{ $secretName }}
    verbs:
      - get
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/component: config-generate-job
    {{- include "forgejo-runner.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  annotations:
    "helm.sh/resource-policy": keep
    "helm.sh/hook": "pre-install"
    "helm.sh/hook-weight": "1"
type: Opaque
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "forgejo-runner.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
    "helm.sh/hook-weight": "3"
spec:
  template:
    metadata:
      annotations:
        config-hash: {{ toYaml .Values.runner.config | sha256sum }}
    spec:
      restartPolicy: "Never"
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Registers the runner unless the Secret already holds a .runner file, then writes
        # the Secret manifest for the next container.
        - name: generate-config
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              cd /data
              if [ -s /current/.runner ]; then
                echo "runner-config exists already"
                cp /current/.runner /data/.runner
              else
                /bin/forgejo-runner register --no-interactive --token "${CONFIG_TOKEN}" --name "${CONFIG_NAME}" --instance "${CONFIG_INSTANCE}" --labels docker:docker://catthehacker/ubuntu:act-latest 2>&1 | tee /tmp/reg.log
                grep -q 'Runner registered successfully' /tmp/reg.log
              fi
              cat > /data/secret.yaml <<EOF
              apiVersion: v1
              kind: Secret
              metadata:
                name: {{ $secretName }}
              data:
                .runner: $(base64 /data/.runner | tr -d '\n')
              EOF
          env:
            - name: CONFIG_NAME
              value: {{ .Values.runner.config.name | quote }}
            - name: CONFIG_INSTANCE
              value: {{ .Values.runner.config.instance | quote }}
            - name: CONFIG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "runner.config.tokenSecret is required" .Values.runner.config.tokenSecret | quote }}
                  key: {{ .Values.runner.config.tokenKey | quote }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.kubectl.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /data/
              name: data
            - name: runner-data
              mountPath: /current
            - name: tmp
              mountPath: /tmp
      containers:
        - name: upload-config
          image: "{{ .Values.kubectl.image.repository }}:{{ .Values.kubectl.image.tag }}"
          imagePullPolicy: {{ .Values.kubectl.image.pullPolicy }}
          args: ["apply", "--server-side", "--force-conflicts", "--field-manager=forgejo-runner-config", "--filename=/data/secret.yaml"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.kubectl.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /data/
              name: data
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: runner-data
          secret:
            secretName: {{ $secretName }}
  parallelism: 1
  completions: 1
  backoffLimit: 1
{{ end }}
