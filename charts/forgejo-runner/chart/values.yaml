# Default values for forgejo-runner.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
image:
  registry: code.forgejo.org
  repository: forgejo/runner
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "13.2.0"
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
runner:
  config:
    # -- register the runner in a pre-install hook and keep its .runner file in the Secret <fullname>-config
    create: true
    # -- use an existing Secret with a .runner file instead
    existingSecret: ""
    instance: https://codeberg.org
    name: ""
    # -- Secret and key holding the registration token (Emporium: the app's Secret)
    tokenSecret: ""
    tokenKey: token
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
dind:
  image:
    registry: docker.io
    repository: library/docker
    pullPolicy: IfNotPresent
    tag: "29.9.1-dind"
  resources:
    requests:
      cpu: 1
      memory: 2Gi
    limits:
      memory: 8Gi
  # dockerd needs privileged mode; the runner container does not
  securityContext:
    privileged: true
# kubectl (no shell) of the registration hook, applies the generated Secret
kubectl:
  image:
    registry: registry.k8s.io
    repository: kubectl
    pullPolicy: IfNotPresent
    tag: "v1.35.9"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
# fsGroup: 2000

# runner container (the image runs as 1000:1000; the Docker socket belongs to group 1000)
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}
tolerations: []
affinity: {}
