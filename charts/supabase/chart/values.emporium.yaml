## @userSupplied StorageSize
## @label Storage Size
## @type byteSize
## @description The size of the volume used for the storage service. Default is 8Gi.
## @optional

## @userSupplied DatabaseSize
## @label Database Size
## @type byteSize
## @description The size of the volume used for the Postgres DB. Default is 8Gi.
## @optional

supabase:
  publicUrl: api.{{ .Emporium.Integrations.DNS.Hostname }}

  auth:
    image:
      repository: supabase/gotrue
      tag: v2.159.1
    # GOTRUE_SMTP_* settings come from the Secret templates/secret-smtp.yaml
    # creates (the subchart only mounts auth.extraConfig with an existing ConfigMap).
    extraEnvVarsSecret: {{ printf "%s-smtp" .Emporium.Name | quote }}

  studio:
    ingress:
      enabled: true

      pathType: Prefix

      annotations:
        {{- if .Emporium.Annotations }}
        {{- toYaml .Emporium.Annotations | nindent 8 }}
        {{- end }}
        kubernetes.io/tls-acme: "true"

      hostname: {{ .Emporium.Integrations.DNS.Hostname }}
      tls: true

  kong:
    ingress:
      enabled: true
      hostname: api.{{ .Emporium.Integrations.DNS.Hostname }}
      tls: true

      annotations:
        {{- if .Emporium.Annotations }}
        {{- toYaml .Emporium.Annotations | nindent 8 }}
        {{- end }}
        kubernetes.io/tls-acme: "true"

  storage:
    persistence:
      size: {{ default "8Gi" .Emporium.UserSupplied.StorageSize | quote }}

  postgresql:
    primary:
      persistence:
        size: {{ default "8Gi" .Emporium.UserSupplied.DatabaseSize | quote }}

smtp:
  host: {{ .Emporium.Integrations.SMTP.Host | quote }}
  port: {{ .Emporium.Integrations.SMTP.Port | quote }}
  username: {{ .Emporium.Integrations.SMTP.Username | quote }}
  password: {{ .Emporium.Integrations.SMTP.Password | quote }}
  from: {{ .Emporium.Integrations.SMTP.From | quote }}
