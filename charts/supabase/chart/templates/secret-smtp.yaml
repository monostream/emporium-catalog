{{- if .Values.smtp.host }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-smtp" .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  GOTRUE_SMTP_HOST: {{ .Values.smtp.host | quote }}
  GOTRUE_SMTP_PORT: {{ .Values.smtp.port | toString | quote }}
  GOTRUE_SMTP_USER: {{ .Values.smtp.username | quote }}
  GOTRUE_SMTP_PASS: {{ .Values.smtp.password | quote }}
  GOTRUE_SMTP_ADMIN_EMAIL: {{ .Values.smtp.from | quote }}
  GOTRUE_SMTP_SENDER_NAME: {{ .Values.smtp.senderName | quote }}
{{- end }}
