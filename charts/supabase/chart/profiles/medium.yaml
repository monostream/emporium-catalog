# Production apps with moderate traffic: about 2.6 CPU / 4.8 GiB requested.
# Storage sizes are inputs/integrations, never profile values.
supabase:
  deployment:
    db:
      resources:
        requests: { cpu: "1", memory: 2Gi }
        limits: { memory: 4Gi }
    kong:
      replicaCount: 2
      resources:
        requests: { cpu: 200m, memory: 384Mi }
        limits: { memory: 768Mi }
    auth:
      replicaCount: 2
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { memory: 512Mi }
    rest:
      replicaCount: 2
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { memory: 512Mi }
    realtime:
      resources:
        requests: { cpu: 200m, memory: 512Mi }
        limits: { memory: 1Gi }
    meta:
      replicaCount: 1
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits: { memory: 512Mi }
    studio:
      resources:
        requests: { cpu: 100m, memory: 384Mi }
        limits: { memory: 1Gi }
    functions:
      resources:
        requests: { cpu: 200m, memory: 256Mi }
        limits: { memory: 1Gi }
    storage:
      # Files are in the object storage, so the Storage API scales out.
      replicaCount: 2
      resources:
        requests: { cpu: 200m, memory: 256Mi }
        limits: { memory: 1Gi }
