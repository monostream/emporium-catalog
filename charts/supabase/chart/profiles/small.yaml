# Development and small apps: about 0.6 CPU / 1.7 GiB requested.
# Storage sizes are inputs/integrations, never profile values.
supabase:
  deployment:
    db:
      resources:
        requests: { cpu: 250m, memory: 512Mi }
        limits: { memory: 1Gi }
    kong:
      replicaCount: 1
      resources:
        requests: { cpu: 50m, memory: 256Mi }
        limits: { memory: 512Mi }
    auth:
      replicaCount: 1
      resources:
        requests: { cpu: 20m, memory: 64Mi }
        limits: { memory: 256Mi }
    rest:
      replicaCount: 1
      resources:
        requests: { cpu: 20m, memory: 64Mi }
        limits: { memory: 256Mi }
    realtime:
      resources:
        requests: { cpu: 50m, memory: 256Mi }
        limits: { memory: 512Mi }
    meta:
      replicaCount: 1
      resources:
        requests: { cpu: 20m, memory: 96Mi }
        limits: { memory: 256Mi }
    studio:
      resources:
        requests: { cpu: 50m, memory: 256Mi }
        limits: { memory: 1Gi }
    functions:
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits: { memory: 512Mi }
    storage:
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits: { memory: 512Mi }
