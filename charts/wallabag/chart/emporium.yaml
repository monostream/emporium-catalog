apiVersion: emporium.build/v1

sections:
  - { id: general, label: General }
  - { id: admin, label: Local administrator, description: "Wallabag has no single sign-on. Emporium creates this account before Wallabag serves its first request; the built-in wallabag/wallabag account is never created. It is the Wallabag super administrator and creates the other users." }

inputs:
  Locale:
    label: Default language
    description: Interface language for new users (a Wallabag locale code such as en, de, fr).
    type: string
    default: en
    pattern: '^[a-z]{2}(_[A-Z]{2})?$'
    path: config.locale
  AdminUsername:
    label: Administrator username
    type: string
    default: admin
    required: true
    installOnly: true
    pattern: '^[A-Za-z0-9_.-]{3,64}$'
    section: admin
    path: admin.username
  AdminEmail:
    label: Administrator email
    description: Wallabag requires an email address for every account. Used only when the account is created.
    type: string
    default: admin@example.org
    required: true
    installOnly: true
    pattern: '^[^\s@]+@[^\s@]+\.[A-Za-z]{2,}$'
    section: admin
    path: admin.email
  AdminPassword:
    label: Administrator password
    description: Leave empty to generate one (stored in the app's Secret). Used only when the account is created; change it later in Wallabag. Printable ASCII, 8-72 characters.
    type: secret
    generate: { length: 24, charset: alnum }
    pattern: '^[\x21-\x7E]{8,72}$'
    section: admin
    ref: { namePath: admin.existingSecret, keyPath: admin.passwordKey }
  AppSecret:
    label: Application secret
    description: Signs the CSRF, remember-me and password-reset tokens. Generated; changing it signs everybody out.
    type: secret
    generate: { length: 48, charset: alnum }
    section: admin
    ref: { namePath: secrets.existingSecret, keyPath: secrets.appSecretKey, key: SYMFONY__ENV__SECRET }

integrations:
  web:
    type: ingress
    access: { default: authenticated }
    # Mobile apps and browser extensions sign in with OAuth (client id and secret created
    # in Wallabag under "API clients management", plus username and password) and call the
    # REST API with the bearer token. Feeds are protected by a per-user token in the URL.
    # Not skipped: /oauth/v2/auth (browser authorization), the web UI, /share/* (public
    # share pages), /developer (client management).
    skipPaths: [/api/*, /oauth/v2/token, /feed/*]
    bind:
      Hostname: ingress.host
      Annotations: ingress.annotations
      TLSSecretName: ingress.tlsSecretName
      IngressClassName: ingress.className
  data:
    type: storage
    size: { default: 2Gi, growOnly: true }
    bind:
      ClaimName: storage.data.existingClaim
  db:
    type: postgres
    database: wallabag
    owner: wallabag
    version: "17"
    storage: { default: 5Gi, growOnly: true }
    # Wallabag reads the connection from these variables (PDO pgsql, sslmode=prefer by default).
    secretKeys:
      SYMFONY__ENV__DATABASE_HOST: host
      SYMFONY__ENV__DATABASE_PORT: port
      SYMFONY__ENV__DATABASE_NAME: dbname
      SYMFONY__ENV__DATABASE_USER: username
      SYMFONY__ENV__DATABASE_PASSWORD: password

components:
  app:
    label: Wallabag
    resources: resources
    replicas: { fixed: 1, reason: "Downloaded images live on a ReadWriteOnce volume; the database migrations run at start" }
  db:
    label: PostgreSQL
    integration: db

profiles:
  default: small
  small:
    label: Small
    description: A household or a small team
    values: profiles/small.yaml
    integrations:
      db: { instances: 1 }
