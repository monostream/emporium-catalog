{{- if .Values.admin.existingSecret }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-bootstrap
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  bootstrap.py: |
    """Init container: make sure Mealie's default administrator never has its public password.

    Mealie seeds changeme@example.com / MyPassword into an empty database and has no setting for
    it. This runs before Mealie serves, on every pod start, directly against the database:
      1. Mealie's own database init (migrations and seeding), the same call the app makes;
      2. if the default-email account exists and its password hash still verifies against the
         public default, replace the password (and email, username) with ADMIN_*; otherwise do
         nothing. No HTTP, no login attempts, no state.
    """
    import os
    import sys

    from mealie.core.config import get_app_settings
    from mealie.core.security.providers.credentials_provider import CredentialsProvider
    from mealie.core.security.security import hash_password
    from mealie.db.db_setup import session_context
    from mealie.db.init_db import main as init_database
    from mealie.repos.repository_factory import AllRepositories

    DEFAULT_PASSWORD = "MyPassword"
    new_password = os.environ["ADMIN_PASSWORD"]
    if len(new_password) < 8:
        sys.exit("administrator password must have at least 8 characters (Mealie minimum)")

    init_database()
    settings = get_app_settings()
    with session_context() as session:
        repos = AllRepositories(session, group_id=None, household_id=None)
        user = repos.users.get_one(settings._DEFAULT_EMAIL, "email")
        if user is None:
            print("no default administrator account, nothing to do", flush=True)
        elif not CredentialsProvider.verify_password(DEFAULT_PASSWORD, user.password):
            print("default administrator has a custom password, left untouched", flush=True)
        else:
            user.email = os.environ["ADMIN_EMAIL"]
            user.username = os.environ["ADMIN_USERNAME"]
            user.full_name = "Administrator"
            repos.users.update(user.id, user)
            repos.users.update_password(user.id, hash_password(new_password))
            print("default administrator replaced", flush=True)
{{- end }}
