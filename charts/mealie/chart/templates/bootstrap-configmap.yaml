{{- if .Values.admin.existingSecret }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-bootstrap
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  bootstrap.py: |
    """Keep Mealie's built-in administrator (changeme@example.com / MyPassword) unusable.

    Mealie creates that account at the first start, with a public password and no setting to
    change it. The pod is NotReady (the main container's readiness probe waits for /status/ready)
    until this script has checked the CURRENT database:
      - no account with the default email: nothing to do, ready;
      - the default password still works: set ADMIN_PASSWORD, log in again with it (the old token
        is invalid after a password change), move the account to ADMIN_EMAIL / ADMIN_USERNAME, ready;
      - the default password does not work: the account was customised, left untouched, ready.
    There is no state on disk. /status/ready is removed at start and whenever the API stops
    answering, and the check runs again, so a reset or restored database is handled too. The
    default login is only attempted while the account is unprovisioned and at most once per
    process in the customised case, so an administrator is never locked out by retries. Any
    other failure leaves the pod NotReady and is retried.
    """
    import json
    import os
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request

    BASE = "http://127.0.0.1:%s" % os.environ.get("PORT", "9000")
    DEFAULT_EMAIL = "changeme@example.com"
    DEFAULT_PASSWORD = "MyPassword"
    NEW_PASSWORD = os.environ["ADMIN_PASSWORD"]
    NEW_EMAIL = os.environ["ADMIN_EMAIL"]
    NEW_USERNAME = os.environ["ADMIN_USERNAME"]
    READY = "/status/ready"


    def call(method, path, body=None, form=None, token=None):
        headers = {}
        data = None
        if body is not None:
            data = json.dumps(body).encode()
            headers["Content-Type"] = "application/json"
        if form is not None:
            data = urllib.parse.urlencode(form).encode()
            headers["Content-Type"] = "application/x-www-form-urlencoded"
        if token:
            headers["Authorization"] = "Bearer " + token
        req = urllib.request.Request(BASE + path, data=data, method=method, headers=headers)
        with urllib.request.urlopen(req, timeout=20) as resp:
            raw = resp.read()
            return json.loads(raw) if raw else {}


    def set_ready(ready):
        if ready:
            with open(READY, "w") as f:
                f.write("ready\n")
        elif os.path.exists(READY):
            os.remove(READY)


    def login(password):
        return call("POST", "/api/auth/token", form={"username": DEFAULT_EMAIL, "password": password})["access_token"]


    STATE = {"have_new": False}  # our password is set on the account


    def provision():
        """Returns "done" or "customised"."""
        token = None
        if not STATE["have_new"]:
            try:
                token = login(DEFAULT_PASSWORD)
            except urllib.error.HTTPError as exc:
                if exc.code not in (401, 423):
                    raise
        if token is not None:
            call("PUT", "/api/users/password", body={"currentPassword": DEFAULT_PASSWORD, "newPassword": NEW_PASSWORD}, token=token)
            STATE["have_new"] = True
        # Tokens issued before a password change are invalid: always log in again with our password.
        try:
            token = login(NEW_PASSWORD)
        except urllib.error.HTTPError as exc:
            if exc.code in (401, 423) and not STATE["have_new"]:
                return "customised"
            raise
        me = call("GET", "/api/users/self", token=token)
        me["email"] = NEW_EMAIL
        me["username"] = NEW_USERNAME
        me["fullName"] = "Administrator"
        call("PUT", "/api/users/" + me["id"], body=me, token=token)
        return "done"


    def run():
        if len(NEW_PASSWORD) < 8:
            raise SystemExit("administrator password must have at least 8 characters (Mealie minimum); refusing to serve with the default login active")
        set_ready(False)
        customised = False
        while True:
            try:
                info = call("GET", "/api/app/about/startup-info")
            except Exception:
                set_ready(False)
                time.sleep(5)
                continue
            if not info.get("isFirstLogin"):
                customised = False
                STATE["have_new"] = False
                set_ready(True)
            elif customised:
                set_ready(True)
            else:
                set_ready(False)
                try:
                    result = provision()
                    print("default administrator %s" % ("replaced" if result == "done" else "has a custom password, left untouched"), flush=True)
                    if result == "customised":
                        customised = True
                except Exception as exc:  # never print the response: it may hold tokens
                    print("bootstrap step failed: %s" % type(exc).__name__, file=sys.stderr, flush=True)
                    time.sleep(10)
                continue
            time.sleep(10)


    run()
{{- end }}
