{{- if .Values.admin.existingSecret }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-bootstrap
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  bootstrap.py: |
    """Replace Mealie's built-in administrator (changeme@example.com / MyPassword).

    Mealie creates that account at the first start, with a public password and no setting to
    change it. The pod stays NotReady (the main container's readiness probe waits for
    /status/ready) until this script is done:
      - the default account is gone or its password is no longer the default: nothing to do;
      - the default password still works: set ADMIN_PASSWORD, then move the account to ADMIN_EMAIL
        with the username ADMIN_USERNAME.
    The default login is tried at most once per volume (marker file), so an administrator who
    already customised the account is never locked out. Any other failure exits non-zero and the
    pod stays NotReady.
    """
    import json
    import os
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request

    BASE = "http://127.0.0.1:%s" % os.environ.get("PORT", "9000")
    DEFAULT_EMAIL = "changeme@example.com"
    DEFAULT_PASSWORD = "MyPassword"
    NEW_PASSWORD = os.environ["ADMIN_PASSWORD"]
    NEW_EMAIL = os.environ["ADMIN_EMAIL"]
    NEW_USERNAME = os.environ["ADMIN_USERNAME"]
    MARKER = "/data/.emporium-admin-bootstrap"
    READY = "/status/ready"


    def call(method, path, body=None, form=None, token=None):
        headers = {}
        data = None
        if body is not None:
            data = json.dumps(body).encode()
            headers["Content-Type"] = "application/json"
        if form is not None:
            data = urllib.parse.urlencode(form).encode()
            headers["Content-Type"] = "application/x-www-form-urlencoded"
        if token:
            headers["Authorization"] = "Bearer " + token
        req = urllib.request.Request(BASE + path, data=data, method=method, headers=headers)
        with urllib.request.urlopen(req, timeout=20) as resp:
            raw = resp.read()
            return json.loads(raw) if raw else {}


    def wait_ready():
        while True:
            try:
                return call("GET", "/api/app/about/startup-info")
            except Exception:
                time.sleep(5)


    def finish(message):
        with open(MARKER, "w") as f:
            f.write(message + "\n")
        with open(READY, "w") as f:
            f.write("ready\n")
        print(message, flush=True)


    def run():
        if len(NEW_PASSWORD) < 8:
            raise SystemExit("administrator password must have at least 8 characters (Mealie minimum); refusing to serve with the default login active")
        info = wait_ready()
        if os.path.exists(MARKER):
            open(READY, "w").write("ready\n")
            print("administrator already handled", flush=True)
            return
        if not info.get("isFirstLogin"):
            finish("default administrator account no longer exists, nothing to replace")
            return
        try:
            token = call("POST", "/api/auth/token", form={"username": DEFAULT_EMAIL, "password": DEFAULT_PASSWORD})["access_token"]
        except urllib.error.HTTPError as exc:
            if exc.code in (401, 423):
                finish("default administrator has a custom password, left untouched")
                return
            raise
        # The password change must succeed; otherwise the pod stays NotReady.
        call("PUT", "/api/users/password", body={"currentPassword": DEFAULT_PASSWORD, "newPassword": NEW_PASSWORD}, token=token)
        try:
            me = call("GET", "/api/users/self", token=token)
            me["email"] = NEW_EMAIL
            me["username"] = NEW_USERNAME
            me["fullName"] = "Administrator"
            call("PUT", "/api/users/" + me["id"], body=me, token=token)
        except Exception as exc:
            print("password replaced, profile update failed: %s" % type(exc).__name__, file=sys.stderr, flush=True)
        finish("default administrator replaced")


    try:
        run()
    except SystemExit:
        raise
    except Exception as exc:  # never print the response: it may hold tokens
        print("bootstrap failed: %s" % type(exc).__name__, file=sys.stderr, flush=True)
        sys.exit(1)
    while True:
        time.sleep(3600)
{{- end }}
