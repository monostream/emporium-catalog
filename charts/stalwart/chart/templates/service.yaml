apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "chart.selectorLabels" . | nindent 4 }}
{{- if .Values.mail.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.fullname" . }}-mail
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  {{- with .Values.mail.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.mail.service.type }}
  {{- with .Values.mail.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  ports:
    - { name: smtp, port: 25, targetPort: smtp }
    - { name: smtps, port: 465, targetPort: smtps }
    - { name: submission, port: 587, targetPort: submission }
    - { name: imap, port: 143, targetPort: imap }
    - { name: imaps, port: 993, targetPort: imaps }
    - { name: pop3, port: 110, targetPort: pop3 }
    - { name: pop3s, port: 995, targetPort: pop3s }
    - { name: sieve, port: 4190, targetPort: sieve }
  selector:
    {{- include "chart.selectorLabels" . | nindent 4 }}
{{- end }}
