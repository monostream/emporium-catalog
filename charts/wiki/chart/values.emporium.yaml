wiki:
  ingress:
    enabled: true
    annotations: {{ .Emporium.Integrations.web.Annotations | toJson }}
    hosts:
      - host: {{ .Emporium.Integrations.web.Hostname | quote }}
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: {{ .Emporium.Integrations.web.TLSSecretName | quote }}
        hosts: {{ .Emporium.Integrations.web.AllHosts | toJson }}

  # CloudNativePG serves TLS with its own CA. Wiki.js connects with
  # rejectUnauthorized when DB_SSL is true, so trusting the CNPG CA through
  # NODE_EXTRA_CA_CERTS gives certificate and hostname verification
  # (verify-full; Host is the -rw.<ns>.svc name in the certificate).
  # externalPostgresql.ca (DB_SSL_CA) only takes an inline certificate body.
  volumes:
    - name: postgres-ca
      secret:
        secretName: {{ .Emporium.Integrations.postgres.CASecretName | quote }}
        items:
          - key: ca.crt
            path: ca.crt

  externalPostgresql:
    host: {{ .Emporium.Integrations.postgres.Host | quote }}
    port: {{ .Emporium.Integrations.postgres.Port }}
    database: {{ .Emporium.Integrations.postgres.Database | quote }}
    username: {{ .Emporium.Integrations.postgres.Username | quote }}
    existingSecret: {{ .Emporium.Integrations.postgres.SecretName | quote }}
    existingSecretKey: {{ .Emporium.Integrations.postgres.PasswordKey | quote }}
