apiVersion: emporium.build/v1

integrations:
  web:
    type: ingress
    access: { default: authenticated }
    bind:
      IngressClassName: ingress.className
  data:
    type: storage
    size: { default: 10Gi, growOnly: true }
    bind:
      ClaimName: persistence.existingClaim

components:
  app:
    label: rotki
    resources: resources
    replicas: { fixed: 1, reason: "Encrypted user databases on a ReadWriteOnce volume" }

profiles:
  default: small
  small:
    label: Small
    description: One or a few portfolios
    values: profiles/small.yaml
