apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-php
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  zz-limesurvey.ini: |
    upload_max_filesize = {{ .Values.php.uploadMaxFilesize }}
    post_max_size = {{ .Values.php.postMaxSize }}
    memory_limit = {{ .Values.php.memoryLimit }}
    auto_prepend_file = /scripts/route-guard.php
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-init
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  start.sh: |
{{ .Files.Get "files/start.sh" | indent 4 }}
  post.sh: |
{{ .Files.Get "files/post.sh" | indent 4 }}
  set-admin.php: |
{{ .Files.Get "files/set-admin.php" | indent 4 }}
  route-guard.php: |
{{ .Files.Get "files/route-guard.php" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-apache
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  zz-emporium-block-route-param.conf: |
{{ .Files.Get "files/block-route-param.conf" | indent 4 }}
