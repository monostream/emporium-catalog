# LimeSurvey (Yii) lets a request choose its controller route with an "r" query parameter or an
# "/r/<route>" path segment, even after a URL rule matched. The Emporium login skips only
# respondent URLs, so such a request would reach admin, API or plugin routes through a skipped
# prefix. The path URL format never needs them: refuse every request that carries one.
<If "%{QUERY_STRING} =~ m#(^|&)(r|%72)(=|&|$|%5[bB]|\[)#i || %{REQUEST_URI} =~ m#(^|/)r(/|$)#i">
    Require all denied
</If>
