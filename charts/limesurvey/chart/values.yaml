# Base configuration. Renders on its own; Emporium fills the connection values
# through emporium.yaml (bind, inputs) and values.emporium.yaml.
nameOverride: ""
fullnameOverride: ""

# Community image martialblog/docker-limesurvey (LimeSurvey publishes no image of its own):
# LimeSurvey 7.x release from the upstream GitHub tag (checksum verified at build), PHP 8.4,
# Apache with mod_php, runs as www-data on port 8080.
image:
  repository: martialblog/limesurvey
  tag: "7.5.1-261021-apache"
  pullPolicy: IfNotPresent

service:
  port: 8080

# Initial administrator. The image creates it on the first start (empty database) and
# ignores these values afterwards; change the password in LimeSurvey.
admin:
  username: admin
  name: Administrator
  email: admin@limesurvey.invalid
  # Secret holding the generated password and the data encryption key and nonce.
  existingSecret: ""
  passwordKey: ADMIN_PASSWORD
  encryptionKeyKey: ENCRYPTION_KEY
  encryptionNonceKey: ENCRYPTION_NONCE

# PostgreSQL. Emporium provides it through the postgres integration (CloudNativePG).
database:
  # Secret holding the connection pieces under the keys below.
  existingSecret: ""
  keys:
    username: DB_USERNAME
    password: DB_PASSWORD
    hostname: DB_HOSTNAME
    port: DB_PORT
    name: DB_NAME
  # libpq TLS mode and the Secret (key ca.crt) with the server CA. verify-full needs the CA.
  sslMode: verify-full
  caSecret: ""

storage:
  upload:
    # PersistentVolumeClaim for /var/www/html/upload (survey files, themes, plugins).
    # Empty: emptyDir.
    existingClaim: ""

# PHP limits (php.ini-production defaults are 2M upload / 8M post).
php:
  uploadMaxFilesize: 32M
  postMaxSize: 32M
  memoryLimit: 256M

# Additional environment variables (see the image README).
extraEnv: []

# Filled by Emporium through the `web` ingress integration.
ingress:
  enabled: true
  className: ""
  host: ""
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
  tlsSecretName: ""
  tlsHosts: []

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 33
  runAsGroup: 33
  fsGroup: 33
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
