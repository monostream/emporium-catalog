apiVersion: emporium.build/v1

sections:
  - { id: general, label: General }
  - { id: sso, label: Single sign-on, description: "Roles come from the Emporium (Logto) roles claim." }
  - { id: admin, label: Local administrator, description: "Open WebUI creates this account at the first start. Use it when single sign-on is unavailable." }

inputs:
  OllamaBaseUrl:
    label: Ollama URL
    description: "Address of an Ollama server, for example http://ollama.<namespace>.svc:11434 when the Ollama app is installed in the cluster. Only used at the first start: Open WebUI keeps connection settings in its database afterwards, so change it later under Admin Settings > Connections. Leave empty to add connections there."
    type: string
    default: ""
    pattern: '^(https?://[^\s]+)?$'
  SsoSignup:
    label: Create accounts at the first single sign-on
    description: Every Emporium user with the user or admin role below who signs in gets an Open WebUI account. Off means only existing accounts can sign in.
    type: boolean
    default: true
    section: sso
    path: oidc.signup
  AdminRole:
    label: Emporium role for administrators
    description: Users with this Emporium (Logto) role become Open WebUI administrators; everyone else with the user role is a regular user.
    type: string
    default: emporium-admin
    required: true
    section: sso
    path: oidc.adminRole
  UserRole:
    label: Emporium role for users
    description: Users need this role (or the administrator role); users with no role at all stay pending until an administrator approves them.
    type: string
    default: emporium-user
    required: true
    section: sso
    path: oidc.userRole
  AdminEmail:
    label: Administrator email
    description: Login name of the local administrator. It does not have to be a real mailbox.
    type: string
    default: admin@emporium.local
    required: true
    installOnly: true
    pattern: '^[^\s@]+@[^\s@]+$'
    section: admin
    path: admin.email
  AdminPassword:
    label: Administrator password
    description: Leave empty to generate one (stored in the app's Secret). Used only when the account is created; change it later in Open WebUI.
    type: secret
    generate: { length: 24, charset: alnum }
    section: admin
    ref: { namePath: admin.existingSecret, keyPath: admin.passwordKey }
  SecretKey:
    label: Session signing key
    type: secret
    generate: { length: 48, charset: alnum }
    section: admin
    ref: { namePath: secret.existingSecret, keyPath: secret.secretKey }

integrations:
  web:
    type: ingress
    access: { default: authenticated }
    # The Open WebUI REST API and the OpenAI/Ollama proxies are called by tools and
    # editor plugins with an Open WebUI API key.
    skipPaths: [/api/*, /openai/*, /ollama/*]
    # Open WebUI's own OpenID Connect login.
    redirectPaths: [/oauth/oidc/callback]
    bind:
      Hostname: ingress.host
      Annotations: ingress.annotations
      TLSSecretName: ingress.tlsSecretName
      IngressClassName: ingress.className
  sso:
    type: oidc
  db:
    type: postgres
    database: openwebui
    owner: openwebui
    version: "17"
    storage: { default: 5Gi, growOnly: true }
    # psycopg: sslmode=require encrypts and accepts the CloudNativePG certificate without a CA file.
    secretKeys:
      DATABASE_URL: uri-sslmode-require
  data:
    type: storage
    size: { default: 10Gi, growOnly: true }
    bind:
      ClaimName: persistence.existingClaim

components:
  app:
    label: Open WebUI
    resources: resources
    replicas: { fixed: 1, reason: "Uploads and the vector store are files on a ReadWriteOnce volume" }
  db:
    label: PostgreSQL
    integration: db

profiles:
  default: small
  small:
    label: Small
    description: A household or a small team, chat with hosted or local models
    values: profiles/small.yaml
    integrations:
      db: { instances: 1 }
