apiVersion: emporium.build/v1

sections:
  - { id: general, label: General }
  - { id: security, label: Security, description: "Hoppscotch encrypts the SMTP password and the OAuth client secrets in its database with this key." }

inputs:
  DataEncryptionKey:
    label: Data encryption key
    description: Exactly 32 characters. Leave empty to generate one. Changing it later makes the stored settings unreadable, so it can only be set at install.
    type: secret
    generate: { length: 32, charset: alnum }
    pattern: '^[A-Za-z0-9]{32}$'
    installOnly: true
    section: security
    ref: { namePath: app.existingSecret, keyPath: app.dataEncryptionKeyKey }

integrations:
  web:
    type: ingress
    access: { default: authenticated }
    # The Hoppscotch CLI (hopp test) fetches collections and environments with an
    # access token that the backend checks itself.
    skipPaths: [/backend/v1/access-tokens/collection/*, /backend/v1/access-tokens/environment/*]
    bind:
      Hostname: ingress.host
      Annotations: ingress.annotations
      TLSSecretName: ingress.tlsSecretName
      IngressClassName: ingress.className
  mail:
    type: smtp
  db:
    type: postgres
    database: hoppscotch
    owner: hoppscotch
    version: "17"
    storage: { default: 5Gi, growOnly: true }
    # Prisma: sslmode=require encrypts and accepts the CloudNativePG certificate without a CA file.
    secretKeys:
      DATABASE_URL: uri-sslmode-require

components:
  app:
    label: Hoppscotch
    resources: resources
    replicas: { fixed: 1, reason: "The backend applies database migrations and restarts itself after configuration changes" }
    match: { kind: Deployment }
  db:
    label: PostgreSQL
    integration: db

profiles:
  default: small
  small:
    label: Small
    description: A team of a few dozen people
    values: profiles/small.yaml
    integrations:
      db: { instances: 1 }
