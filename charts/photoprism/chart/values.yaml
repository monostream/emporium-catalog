# Base configuration. Renders on its own; Emporium fills the connection values
# through emporium.yaml (bind, inputs) and values.emporium.yaml.
nameOverride: ""
fullnameOverride: ""

image:
  repository: photoprism/photoprism
  tag: "261007"
  pullPolicy: IfNotPresent

service:
  port: 2342

config:
  timezone: UTC
  # Extra PHOTOPRISM_* settings, name without the prefix (e.g. SITE_CAPTION).
  extraEnv: {}

# Local administrator, created at the first start (the account is only created with an empty database).
admin:
  username: photoprism-admin
  # Secret and key holding the administrator password.
  existingSecret: ""
  passwordKey: ADMIN_PASSWORD

indexing:
  workers: 2

# OpenID Connect (PHOTOPRISM_OIDC_*).
oidc:
  enabled: false
  issuer: ""
  clientId: ""
  # Secret and key holding the client secret.
  existingSecret: ""
  clientSecretKey: clientSecret
  # Go straight to the identity provider.
  autoLogin: false
  # Role of accounts created at the first sign-in: guest or admin.
  newUserRole: guest
  # Members of this Emporium role become PhotoPrism administrators.
  emporiumAdminRole: emporium-admin
  webdav: false

persistence:
  # Claim for /photoprism/storage (SQLite database, cache, thumbnails, sidecar files, import folder). Emporium creates it.
  storage:
    existingClaim: ""
    size: 10Gi
  # Claim for the original photos and videos, mounted at /photoprism/originals. Emporium creates it.
  originals:
    existingClaim: ""
    size: 50Gi

# Filled by Emporium through the `web` ingress integration.
ingress:
  enabled: true
  className: ""
  host: ""
  annotations: {}
  tlsSecretName: ""
  tlsHosts: []

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 3Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
