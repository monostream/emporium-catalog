apiVersion: emporium.build/v1

sections:
  - { id: general, label: General }
  - { id: admin, label: Administrator, description: "The local administrator is created at the first start from the password below, so nobody can claim it from the browser. Emporium users sign in with single sign-on." }
  - { id: indexing, label: Indexing }

inputs:
  AutoLogin:
    label: Sign in automatically
    description: Send visitors straight to the Emporium sign-in instead of showing the PhotoPrism login page with its "Continue with Emporium" button. The local administrator can still sign in at /library/login?nosso (see the install notes).
    type: boolean
    default: false
    path: oidc.autoLogin
  NewUserRole:
    label: Role of new single sign-on users
    description: "PhotoPrism Community Edition has only two roles for signed-in users. \"guest\" sees and reacts to albums that were shared with the account, not the library; \"admin\" can do everything. Members of the Emporium role emporium-admin always become administrators. Pick \"admin\" only when every Emporium user may manage the whole library."
    type: enum
    options: [guest, admin]
    default: guest
    path: oidc.newUserRole
  WebDAVForSso:
    label: WebDAV for single sign-on users
    description: Let single sign-on users use WebDAV (to sync from other apps) when their role allows it. Administrators can create an app password under Settings > Account > Apps and Devices.
    type: boolean
    default: false
    path: oidc.webdav
  AdminUsername:
    label: Local administrator username
    description: Break-glass account created at the first start. It is not linked to single sign-on; pick a name no Emporium user has.
    type: string
    default: photoprism-admin
    required: true
    installOnly: true
    pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{1,31}$'
    section: admin
    path: admin.username
  AdminPassword:
    label: Local administrator password
    description: Used to create the local administrator at the first start (8 to 72 characters). Leave empty to generate one (stored in the app's Secret). Changing it later in PhotoPrism does not update the Secret.
    type: secret
    generate: { length: 24, charset: alnum }
    installOnly: true
    pattern: '^[0-9A-Za-z]{8,72}$'
    section: admin
    ref: { namePath: admin.existingSecret, keyPath: admin.passwordKey }
  Workers:
    label: Indexing workers
    description: How many files PhotoPrism indexes in parallel. Each worker needs CPU and memory (the image classifier runs on the CPU); raise it only together with the size profile.
    type: integer
    default: 2
    min: 1
    max: 8
    section: indexing
    path: indexing.workers

integrations:
  web:
    type: ingress
    access: { default: authenticated }
    # PhotoPrism has its own login (local accounts, app passwords, OIDC) and its share links are meant
    # for anonymous viewers: the share page (/s/<token>) creates a link session and then loads the web app
    # (/library/albums) and its API, so those paths cannot sit behind the Emporium login. WebDAV (/originals/,
    # /import/) and the mobile and API clients use app passwords. Only "/" itself stays behind the Emporium login.
    skipPaths: [/s/*, /library/*, /static/*, /api/v1/*, /originals/*, /import/*]
    redirectPaths: [/api/v1/oidc/redirect]
    bind:
      Hostname: ingress.host
      Annotations: ingress.annotations
      TLSSecretName: ingress.tlsSecretName
      IngressClassName: ingress.className
  sso:
    type: oidc
  storage:
    type: storage
    size: { default: 10Gi, growOnly: true }
    bind:
      ClaimName: persistence.storage.existingClaim
  originals:
    type: storage
    size: { default: 50Gi, growOnly: true }
    bind:
      ClaimName: persistence.originals.existingClaim

components:
  app:
    label: PhotoPrism
    resources: resources
    replicas: { fixed: 1, reason: "SQLite database and library indexing on ReadWriteOnce volumes" }

profiles:
  default: small
  small:
    label: Small
    description: A household library, a few tens of thousands of photos
    values: profiles/small.yaml
