apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "chart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: core
---
# XMPP (client connections) for the videobridge, which runs in its own pod.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.fullname" . }}-xmpp
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: xmpp
      port: 5222
      targetPort: xmpp
  selector:
    {{- include "chart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: core
---
# Media (UDP). ClusterIP and HostPort keep it inside the cluster / on the node.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.fullname" . }}-jvb
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  {{- if eq .Values.jvb.exposure "LoadBalancer" }}
  {{- with .Values.jvb.serviceAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
spec:
  {{- if has .Values.jvb.exposure (list "NodePort" "LoadBalancer") }}
  type: {{ .Values.jvb.exposure }}
  {{- else }}
  type: ClusterIP
  {{- end }}
  {{- if eq .Values.jvb.exposure "LoadBalancer" }}
  externalTrafficPolicy: Local
  {{- with .Values.jvb.loadBalancerClass }}
  loadBalancerClass: {{ . | quote }}
  {{- end }}
  {{- end }}
  ports:
    - name: media
      protocol: UDP
      port: {{ include "chart.jvbPort" . }}
      targetPort: media
      {{- if eq .Values.jvb.exposure "NodePort" }}
      # The browser connects to the advertised port, so node port and JVB_PORT are the same.
      nodePort: {{ include "chart.jvbPort" . }}
      {{- end }}
  selector:
    {{- include "chart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: jvb
