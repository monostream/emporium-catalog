image:
  repository: emporium-apps.docker.pkg.emporium.rocks/vscode
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
service:
  type: ClusterIP
  port: 80
persistence:
  enabled: true
  # Use an existing claim instead of creating one (Emporium binds its storage integration here).
  existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 20Gi
rbac:
  # true: the workspace's ServiceAccount is bound to cluster-admin (kubectl/helm against the whole
  # cluster). false: it gets the built-in "admin" role in its own namespace only.
  clusterAdmin: true
gpu:
  nvidiaEnabled: false
  runtimeClass: "nvidia"
ingress:
  enabled: false
  # Leave empty to use the cluster default IngressClass
  ingressClassName: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    memory: 4Gi
nodeSelector: {}
tolerations: []
affinity: {}
docker:
  repository: docker
  pullPolicy: Always
  tag: 29.9.1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 4Gi
