# Base configuration. Renders on its own; Emporium fills the connection values
# through emporium.yaml (bind, inputs) and values.emporium.yaml.
nameOverride: ""
fullnameOverride: ""

image:
  repository: docker.io/outlinewiki/outline
  tag: "1.11.0"
  pullPolicy: IfNotPresent

service:
  port: 3000

config:
  # Public URL of the instance (URL), e.g. https://wiki.example.com
  url: ""
  # Default interface language.
  defaultLanguage: en_US
  # Largest file a user can upload, in MB.
  uploadMaxSizeMb: 25
  logLevel: info

# SECRET_KEY (64 hex characters) and UTILS_SECRET, generated by Emporium.
secrets:
  existingSecret: ""
  secretKey: SECRET_KEY
  utilsKey: UTILS_SECRET

# OpenID Connect login.
oidc:
  enabled: false
  # Issuer URL; Outline appends /.well-known/openid-configuration.
  issuerUrl: ""
  clientId: ""
  # Secret and key holding the client secret.
  existingSecret: ""
  clientSecretKey: clientSecret
  displayName: Emporium
  # Claim used as the username.
  usernameClaim: preferred_username

# PostgreSQL (CloudNativePG through the postgres integration).
database:
  # Secret holding a postgres:// connection URL.
  existingSecret: ""
  urlKey: uri

# Redis/Valkey (queues, cache, websockets).
redis:
  existingSecret: ""
  urlKey: url

# File attachments on a persistent volume (FILE_STORAGE=local).
persistence:
  claimName: ""

# Outgoing email (invitations, notifications). Optional.
# SMTP_SECURE (implicit TLS) is on for port 465 only; other ports use STARTTLS.
smtp:
  host: ""
  port: 587
  username: ""
  from: ""
  existingSecret: ""
  passwordKey: password

# Additional environment variables (see https://docs.getoutline.com/s/hosting/doc/environment-variables).
extraEnv: []

# Filled by Emporium through the `web` ingress integration.
ingress:
  enabled: true
  className: ""
  host: ""
  annotations: {}
  tlsSecretName: ""
  tlsHosts: []

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1536Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
