apiVersion: emporium.build/v1

inputs:
  Title:
    label: Title
    description: HTML page title. Pastes with their own title use that instead.
    type: string
    default: Wastebin
    path: wastebin.env.WASTEBIN_TITLE
  Theme:
    label: Theme
    description: Colour theme, previews at https://matze.github.io/wastebin/
    type: enum
    options: [ayu, base16ocean, catppuccin, coldark, gruvbox, monokai, onehalf, rosepine, solarized]
    default: gruvbox
    path: wastebin.env.WASTEBIN_THEME
  SigningKey:
    label: Cookie signing key
    description: Signs the cookies that let paste creators delete their pastes. Generated at install.
    type: secret
    generate: { length: 96, charset: alnum }
    ref: { namePath: existingSecret, key: WASTEBIN_SIGNING_KEY }
  PasswordSalt:
    label: Password salt
    description: Salt for the keys of password-protected pastes. Changing it makes existing encrypted pastes unreadable.
    type: secret
    generate: { length: 32, charset: alnum }
    ref: { namePath: existingSecret, key: WASTEBIN_PASSWORD_SALT }

integrations:
  web:
    type: ingress
    access: { default: authenticated }
    bind:
      IngressClassName: ingress.className
  data:
    type: storage
    size: { default: 1Gi, growOnly: true }
    bind:
      ClaimName: persistence.existingClaim

components:
  app:
    label: Wastebin
    resources: resources
    replicas: { fixed: 1, reason: "SQLite database on a ReadWriteOnce volume" }

profiles:
  default: small
  small:
    label: Small
    description: Personal use and small teams
    values: profiles/small.yaml
