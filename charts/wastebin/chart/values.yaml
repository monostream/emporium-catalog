# Default values for wastebin.
# This is a YAML-formatted file.

replicaCount: 1

image:
  repository: quxfoo/wastebin
  pullPolicy: IfNotPresent
  tag: "3.9.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8088

ingress:
  enabled: false
  className: ""
  annotations:
    # Matches WASTEBIN_MAX_BODY_SIZE below.
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

persistence:
  enabled: true
  # Use an existing claim instead of creating one (Emporium binds its storage integration here).
  existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi

# Secret holding WASTEBIN_SIGNING_KEY and WASTEBIN_PASSWORD_SALT. Without it Wastebin signs cookies
# with a key generated at startup and uses its built-in password salt.
existingSecret: ""

wastebin:
  env:
    WASTEBIN_DATABASE_PATH: "/data/state.db"
    WASTEBIN_TITLE: "Wastebin"
    WASTEBIN_THEME: "gruvbox"
    # 16 MB instead of the 1 MB default.
    WASTEBIN_MAX_BODY_SIZE: "16777216"
    # The image is FROM scratch: SQLite needs a writable temp directory (emptyDir at /tmp).
    TMPDIR: "/tmp"
