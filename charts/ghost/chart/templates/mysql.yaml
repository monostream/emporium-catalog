apiVersion: v1
kind: Service
metadata:
  name: {{ include "ghost.mysql.fullname" . }}
  labels:
    {{- include "ghost.mysql.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 3306
      targetPort: mysql
      protocol: TCP
      name: mysql
  selector:
    {{- include "ghost.mysql.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ghost.mysql.fullname" . }}
  labels:
    {{- include "ghost.mysql.labels" . | nindent 4 }}
spec:
  # Single MySQL server; the data claim is ReadWriteOnce.
  replicas: 1
  serviceName: {{ include "ghost.mysql.fullname" . }}
  selector:
    matchLabels:
      {{- include "ghost.mysql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ghost.mysql.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.mysql.podSecurityContext | nindent 8 }}
      containers:
        - name: mysql
          securityContext:
            {{- toYaml .Values.mysql.securityContext | nindent 12 }}
          image: "{{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.tag }}"
          imagePullPolicy: {{ .Values.mysql.image.pullPolicy }}
          env:
            # Applied by the image entrypoint only when the data directory is empty (first start).
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ghost.mysql.secretName" . | quote }}
                  key: {{ .Values.mysql.auth.rootPasswordKey | quote }}
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.database | quote }}
            - name: MYSQL_USER
              value: {{ .Values.mysql.user | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ghost.mysql.secretName" . | quote }}
                  key: {{ .Values.mysql.auth.passwordKey | quote }}
          args:
            {{- toYaml .Values.mysql.args | nindent 12 }}
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          startupProbe:
            # The entrypoint's init server listens on the socket only, so TCP ping
            # succeeds once the real server is up.
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.mysql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.mysql.storage.existingClaim | default (printf "%s-mysql" (include "ghost.fullname" .)) }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
