{{- /* Claims the chart creates only outside Emporium; under Emporium the storage
       integrations create them and bind existingClaim. */ -}}
{{- range $key, $claim := dict "content" .Values.storage.content "mysql" .Values.mysql.storage }}
{{- if not $claim.existingClaim }}
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ include "ghost.fullname" $ }}-{{ $key }}
  labels:
    {{- include "ghost.labels" $ | nindent 4 }}
spec:
  accessModes:
    - {{ $claim.accessMode | quote }}
  resources:
    requests:
      storage: {{ $claim.size | quote }}
  {{- with $claim.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end }}
