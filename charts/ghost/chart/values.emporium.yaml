url: {{ printf "https://%s" .Emporium.Integrations.web.Hostname | quote }}

ingress:
  enabled: true
  # proxy-body-size (50m) comes from values.yaml; Helm merges the maps.
  annotations: {{ .Emporium.Integrations.web.Annotations | toJson }}
  hosts:
    - host: {{ .Emporium.Integrations.web.Hostname | quote }}
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: {{ .Emporium.Integrations.web.TLSSecretName | quote }}
      hosts: {{ .Emporium.Integrations.web.AllHosts | toJson }}

{{- with .Emporium.Integrations.mail }}
mail:
  host: {{ .Host | quote }}
  port: {{ .Port }}
  user: {{ .Username | quote }}
  from: {{ .From | quote }}
  existingSecret: {{ .SecretName | quote }}
  passwordKey: {{ .PasswordKey | quote }}
{{- end }}
