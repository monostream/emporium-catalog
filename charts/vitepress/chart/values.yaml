# Default values for vitepress.

replicaCount: 1

image:
  repository: emporium-apps.docker.pkg.emporium.rocks/vitepress
  pullPolicy: IfNotPresent
  tag: "1.1.1"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

# The site: cloned from gitUrl (branch main), built and served under basePath; the repository is
# polled every pollInterval seconds. Empty values use the image defaults
# (https://github.com/monostream/emporium-docs.git, /docs, 60).
basePath: ""
gitUrl: ""
pollInterval: ""

# The image runs git, npm and nginx as root and rewrites the nginx configuration at start.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /docs
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1536Mi

volumes: []
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
