apiVersion: emporium.build/v1

sections:
  - { id: general, label: General }
  - { id: admin, label: Administration, description: "Synapse has no administrator mapping from single sign-on. Create the first administrator with the registration shared secret below (see the README)." }

inputs:
  Federation:
    label: Federation with other Matrix servers
    description: "Off: this server is private, only its own users and rooms. On: other servers can reach it on this host (/_matrix/federation, /.well-known/matrix/server). The server name is this host name and cannot change later."
    type: boolean
    default: false
    path: synapse.federation
  PasswordLogin:
    label: Password login next to single sign-on
    description: Keeps the break-glass administrator able to sign in when single sign-on is unavailable. Turn off to allow only "Continue with Emporium".
    type: boolean
    default: true
    path: synapse.passwordLogin
  MaxUploadSize:
    label: Maximum upload size
    description: Largest file a user can send into a room (for example 50M, 200M). The Emporium ingress limit applies as well.
    type: enum
    options: [10M, 50M, 100M, 250M, 500M, 1G]
    default: 50M
    path: synapse.maxUploadSize
  MacaroonSecretKey:
    label: Macaroon secret key
    description: Signs access tokens. Generated when empty; changing it signs every user out.
    type: secret
    generate: { length: 48, charset: alnum }
    section: admin
    ref: { namePath: synapse.secrets.existingSecret, keyPath: synapse.secrets.macaroonKey, key: MACAROON_SECRET_KEY }
  FormSecret:
    label: Form secret
    description: Protects the Synapse web forms against forgery. Generated when empty.
    type: secret
    generate: { length: 48, charset: alnum }
    section: admin
    ref: { namePath: synapse.secrets.existingSecret, keyPath: synapse.secrets.formKey, key: FORM_SECRET }
  RegistrationSharedSecret:
    label: Registration shared secret
    description: "Break-glass: register_new_matrix_user uses it to create the first administrator without opening registration. Generated when empty."
    type: secret
    generate: { length: 48, charset: alnum }
    section: admin
    ref: { namePath: synapse.secrets.existingSecret, keyPath: synapse.secrets.registrationKey, key: REGISTRATION_SHARED_SECRET }

integrations:
  web:
    type: ingress
    access: { default: authenticated }
    # Matrix clients (Element X, phones, bridges, other servers) authenticate with
    # access tokens or signatures, and the SSO callback comes back from the identity provider.
    # Only the Element web page itself stays behind the Emporium login.
    skipPaths: ["/_matrix/*", "/_synapse/*", "/.well-known/matrix/*"]
    # Synapse's OpenID Connect callback.
    redirectPaths: [/_synapse/client/oidc/callback]
    bind:
      Hostname: ingress.host
      Annotations: ingress.annotations
      TLSSecretName: ingress.tlsSecretName
      IngressClassName: ingress.className
  sso:
    type: oidc
  db:
    type: postgres
    database: synapse
    owner: synapse
    version: "17"
    storage: { default: 5Gi, growOnly: true }
  media:
    type: storage
    size: { default: 10Gi, growOnly: true }

components:
  synapse:
    label: Synapse (homeserver)
    resources: synapse.resources
    replicas: { fixed: 1, reason: "Single-process Synapse with a ReadWriteOnce media volume" }
  element:
    label: Element (web client)
    resources: element.resources
    replicas: { path: element.replicaCount, min: 1, max: 3 }
  db:
    label: PostgreSQL
    integration: db

profiles:
  default: small
  small:
    label: Small
    description: A family, a team or a community of a few dozen people, federation off
    values: profiles/small.yaml
    integrations:
      db: { instances: 1 }
