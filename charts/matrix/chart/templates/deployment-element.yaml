apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.elementName" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: element
spec:
  replicas: {{ .Values.element.replicaCount }}
  selector:
    matchLabels:
      {{- include "chart.elementSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chart.labels" . | nindent 8 }}
        app.kubernetes.io/component: element
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-element.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.elementPodSecurityContext | nindent 8 }}
      containers:
        - name: element
          image: "{{ .Values.element.image.repository }}:{{ .Values.element.image.tag }}"
          imagePullPolicy: {{ .Values.element.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            # nginx listens on this port; the image default (80) needs root.
            - name: ELEMENT_WEB_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet: { path: /config.json, port: http }
          readinessProbe:
            httpGet: { path: /config.json, port: http }
          resources:
            {{- toYaml .Values.element.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
            - name: config
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "chart.elementName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
