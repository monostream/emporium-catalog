apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.synapseName" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8008
      targetPort: http
  selector:
    {{- include "chart.synapseSelector" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.elementName" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "chart.elementSelector" . | nindent 4 }}
