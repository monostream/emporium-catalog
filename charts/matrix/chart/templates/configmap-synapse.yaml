apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.synapseName" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  # No secret in here: every secret is read from a file mounted from a Secret.
  homeserver.yaml: |
    server_name: {{ .Values.synapse.serverName | quote }}
    public_baseurl: {{ printf "%s/" (.Values.synapse.publicBaseUrl | trimSuffix "/") | quote }}
    pid_file: /tmp/homeserver.pid
    report_stats: false
    suppress_key_server_warning: true
    listeners:
      - port: 8008
        tls: false
        type: http
        x_forwarded: true
        bind_addresses: ["0.0.0.0"]
        resources:
          - names: [client, media{{ if .Values.synapse.federation }}, federation{{ end }}]
            compress: false
    database:
      name: psycopg2
      args:
        user: {{ .Values.database.user | quote }}
        database: {{ .Values.database.name | quote }}
        host: {{ .Values.database.host | quote }}
        port: {{ .Values.database.port }}
        sslmode: require
        cp_min: 2
        cp_max: 10
        # The password comes from the PGPASSWORD environment variable.
    log_config: /config/log.config
    media_store_path: /data/media_store
    signing_key_path: /data/signing.key
    max_upload_size: {{ .Values.synapse.maxUploadSize | quote }}
    {{- with .Values.synapse.secrets.existingSecret }}
    macaroon_secret_key_path: /secrets/macaroon-secret-key
    form_secret_path: /secrets/form-secret
    registration_shared_secret_path: /secrets/registration-shared-secret
    {{- end }}
    enable_registration: false
    password_config:
      enabled: {{ .Values.synapse.passwordLogin }}
    {{- if .Values.synapse.federation }}
    serve_server_wellknown: true
    {{- else }}
    # Private server: no inbound federation listener, no outbound federation.
    federation_domain_whitelist: []
    trusted_key_servers: []
    {{- end }}
    sso:
      client_whitelist:
        - {{ printf "%s/" (.Values.synapse.publicBaseUrl | trimSuffix "/") | quote }}
    {{- if and .Values.oidc.enabled .Values.oidc.issuer }}
    oidc_providers:
      - idp_id: emporium
        idp_name: {{ .Values.oidc.providerName | quote }}
        discover: true
        issuer: {{ .Values.oidc.issuer | quote }}
        client_id: {{ .Values.oidc.clientId | quote }}
        client_auth_method: client_secret_basic
        client_secret_path: /secrets/oidc-client-secret
        scopes: ["openid", "profile"]
        allow_existing_users: {{ .Values.oidc.allowExistingUsers }}
        user_mapping_provider:
          config:
            localpart_template: "{{ "{{ user.preferred_username }}" }}"
            display_name_template: "{{ "{{ user.name or user.preferred_username }}" }}"
    {{- end }}
  log.config: |
    version: 1
    formatters:
      precise:
        format: "%(asctime)s - %(name)s - %(lineno)d - %(levelname)s - %(request)s - %(message)s"
    handlers:
      console:
        class: logging.StreamHandler
        formatter: precise
    loggers:
      synapse.storage.SQL:
        level: INFO
    root:
      level: {{ .Values.synapse.logLevel }}
      handlers: [console]
    disable_existing_loggers: false
