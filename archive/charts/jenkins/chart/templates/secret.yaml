apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jenkins.fullname" . }}
  labels:
    {{- include "jenkins.labels" . | nindent 4 }}
type: Opaque
data:
  jenkins-username: {{ .Values.adminUser | default "admin" | b64enc | quote }}
  {{- if not .Values.existingSecret }}
  jenkins-password: {{ .Values.adminPassword | default (randAlphaNum 24) | b64enc | quote }}
  {{- end }}
