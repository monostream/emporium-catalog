apiVersion: emporium.build/v1

inputs:
  AdminPassword:
    label: Local admin password
    description: Password of the local "admin" user, created on first start. With OIDC the login goes through the identity provider; the user backs the agent swarm's API token.
    type: secret
    generate: { length: 32, charset: alnum }
    ref: { namePath: existingSecret, key: ADMIN_PASSWORD }
  ClusterAdmin:
    label: Cluster admin access
    description: Bind Jenkins to cluster-admin so pipelines can deploy anywhere in the cluster. Off limits it to the app's own namespace.
    type: boolean
    default: true
    path: rbac.clusterAdmin
    matrix: true
  AgentWorkspaceSize:
    label: Agent workspace size
    description: Workspace volume of each build agent. Fixed after install.
    type: byteSize
    default: 50Gi
    installOnly: true
    renamedFrom: [AgentWorspaceSize]
    path: agent.persistence.size
  AgentDinDSize:
    label: Agent Docker storage size
    description: Docker-in-Docker image and layer storage of each build agent. Fixed after install.
    type: byteSize
    default: 50Gi
    installOnly: true
    path: agent.docker.persistence.size

integrations:
  web:
    type: ingress
    access: { default: authenticated }
    redirectPaths: [/securityRealm/finishLogin]
    bind:
      IngressClassName: ingress.ingressClassName
  oidc:
    type: oidc
  home:
    type: storage
    size: { default: 5Gi, growOnly: true }
    bind:
      ClaimName: persistence.existingClaim
  workspace:
    type: storage
    size: { default: 50Gi, growOnly: true }
    bind:
      ClaimName: workspace.persistence.existingClaim

components:
  controller:
    label: Jenkins controller
    resources: resources
    replicas: { fixed: 1, reason: "Single controller on ReadWriteOnce volumes" }
    match: { kind: Deployment }
  agent:
    label: Build agent
    resources: agent.resources
    match: { kind: StatefulSet }
  agent-docker:
    label: Agent Docker engine
    parent: agent
    resources: agent.docker.resources

profiles:
  default: small
  small:
    label: Small
    description: A team with a few parallel builds
    values: profiles/small.yaml
