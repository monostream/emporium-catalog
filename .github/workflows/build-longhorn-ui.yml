name: Build Longhorn UI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'images/longhorn-ui/**'
      - '.github/workflows/build-longhorn-ui.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'images/longhorn-ui/**'
      - '.github/workflows/build-longhorn-ui.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Same runner as the other catalog image builds: no self-hosted runner
    # serves this repository (deps-check jobs sat queued until cancelled).
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64

      - name: Login to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.CONTAINER_REGISTRY }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      # No chart: the longhorn release on the cluster points image.longhorn.ui at this image.
      # The tag is the org.opencontainers.image.version label in the Dockerfile.
      - name: Read the image version from the Dockerfile
        id: extract_version
        run: |
          VERSION=$(sed -n 's/^LABEL org.opencontainers.image.version="\(.*\)"$/\1/p' ./images/longhorn-ui/Dockerfile)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push longhorn-ui
        uses: docker/build-push-action@v5
        with:
          file: ./images/longhorn-ui/Dockerfile
          context: ./images/longhorn-ui/
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ vars.CONTAINER_REGISTRY }}/longhorn-ui:${{ steps.extract_version.outputs.version }}
