name: Release Charts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4.0.0
        with:
          version: 'v3.19.0'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cm-push plugin
        run: |
          helm plugin install https://github.com/chartmuseum/helm-push.git --version v0.10.4

      - name: Add helm repos
        env:
          HELM_REPO: ${{ vars.HELM_REPO }}
          HELM_USER: ${{ vars.HELM_USER }}
          HELM_PASSWORD: ${{ secrets.HELM_PASSWORD }}
        run: |
          helm repo add emporium-apps ${{ vars.HELM_REPO }} --username ${{ vars.HELM_USER }} --password ${{ secrets.HELM_PASSWORD }}

      - name: Run cm-push
        run: |
          changed_charts=()

          for dir in charts/*; do
              if [ -d "$dir" ]; then
                  chart_dir="$dir/chart"
                  # if git diff --quiet HEAD~1 HEAD -- "$chart_dir"; then
                  #     continue
                  # fi
                  changed_charts+=("$chart_dir")
              fi
          done

          for chart in "${changed_charts[@]}"; do
              echo "Changed chart detected: $chart"
              #echo "Linting..."
              #helm lint $chart

              echo "Pushing..."
              # Package and push the chart
              helm cm-push $chart emporium-apps
          done
