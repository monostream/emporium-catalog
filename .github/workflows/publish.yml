name: Release Charts

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      repo:
        description: 'Target Helm repository. staging: run from release/0.5 (secrets STAGING_CHARTMUSEUM_USER/PASSWORD). production: run from main or a tag.'
        type: choice
        options:
          - staging
          - production
        default: production

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4.0.0
        with:
          version: 'v3.19.0'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cm-push plugin
        run: |
          helm plugin install https://github.com/chartmuseum/helm-push.git --version v0.10.4

      - name: Select target repository
        env:
          TARGET: ${{ github.event.inputs.repo || 'production' }}
          STAGING_URL: https://charts-staging.emporium-dev.shitlab.meme
          STAGING_USER: ${{ secrets.STAGING_CHARTMUSEUM_USER }}
          STAGING_PASSWORD: ${{ secrets.STAGING_CHARTMUSEUM_PASSWORD }}
          PROD_URL: ${{ vars.HELM_REPO }}
          PROD_USER: ${{ vars.HELM_USER }}
          PROD_PASSWORD: ${{ secrets.HELM_PASSWORD }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            staging)
              if [ "$GITHUB_REF" != "refs/heads/release/0.5" ]; then
                echo "::error::staging publishes only from release/0.5 (ref: $GITHUB_REF)"; exit 1
              fi
              url="$STAGING_URL"; user="$STAGING_USER"; password="$STAGING_PASSWORD"
              ;;
            production)
              if [ "$GITHUB_REF" != "refs/heads/main" ] && [[ "$GITHUB_REF" != refs/tags/* ]]; then
                echo "::error::production publishes only from main or a tag (ref: $GITHUB_REF)"; exit 1
              fi
              url="$PROD_URL"; user="$PROD_USER"; password="$PROD_PASSWORD"
              ;;
            *) echo "::error::unknown repo '$TARGET'"; exit 1 ;;
          esac
          echo "::add-mask::$password"
          {
            echo "HELM_REPO=$url"
            echo "HELM_USER=$user"
            echo "HELM_PASSWORD=$password"
            echo "TARGET=$TARGET"
          } >> "$GITHUB_ENV"

      - name: Add helm repos
        run: |
          helm repo add emporium-apps "$HELM_REPO" --username "$HELM_USER" --password "$HELM_PASSWORD"

      - name: Remove deleted charts from the Helm repository
        if: env.TARGET == 'production'
        env:
          HELM_REPO: ${{ vars.HELM_REPO }}
          HELM_USER: ${{ vars.HELM_USER }}
          HELM_PASSWORD: ${{ secrets.HELM_PASSWORD }}
        run: |
          set -euo pipefail
          base="${HELM_REPO%/}"
          while IFS= read -r name; do
              name="${name%%#*}"
              name="$(echo "$name" | tr -d '[:space:]')"
              [ -z "$name" ] && continue

              status=$(curl -sS -o versions.json -w '%{http_code}' -u "$HELM_USER:$HELM_PASSWORD" "$base/api/charts/$name")
              if [ "$status" = "404" ]; then
                  echo "$name: not in repository, skipping"
                  continue
              elif [ "$status" != "200" ]; then
                  echo "$name: listing versions failed with HTTP $status"
                  cat versions.json
                  exit 1
              fi

              for version in $(jq -r '.[].version' versions.json); do
                  echo "Deleting $name@$version"
                  status=$(curl -sS -o delete.out -w '%{http_code}' -X DELETE -u "$HELM_USER:$HELM_PASSWORD" "$base/api/charts/$name/$version")
                  if [ "$status" = "404" ]; then
                      echo "$name@$version already gone"
                  elif [ "$status" -ge 300 ]; then
                      echo "Deleting $name@$version failed with HTTP $status"
                      cat delete.out
                      exit 1
                  fi
              done
          done < removed-charts.txt
          rm -f versions.json delete.out

      - name: Run cm-push
        run: |
          changed_charts=()

          # Only charts/* is published. Archived charts live under archive/charts/ and are never picked up.
          for dir in charts/*; do
              if [ "$(basename "$dir")" = "_template" ]; then
                  continue
              fi
              if [ -d "$dir" ]; then
                  chart_dir="$dir/chart"
                  # if git diff --quiet HEAD~1 HEAD -- "$chart_dir"; then
                  #     continue
                  # fi
                  changed_charts+=("$chart_dir")
              fi
          done

          for chart in "${changed_charts[@]}"; do
              echo "Changed chart detected: $chart"
              #echo "Linting..."
              #helm lint $chart

              echo "Pushing..."
              # Package and push the chart
              helm cm-push $chart emporium-apps
          done
