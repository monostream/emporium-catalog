name: Build PastePass

on:
  push:
    branches: [ "main" ]
    paths:
      - 'charts/pastepass/build/**'
      - 'charts/pastepass/chart/Chart.yaml'
      - '.github/workflows/build-pastepass.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'charts/pastepass/build/**'
      - 'charts/pastepass/chart/Chart.yaml'
      - '.github/workflows/build-pastepass.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64

      - name: Login to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.CONTAINER_REGISTRY }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      # The image tag is the chart appVersion (values.yaml image.tag defaults to it).
      - name: Read appVersion from Chart.yaml
        id: extract_version
        run: |
          VERSION=$(grep '^appVersion:' ./charts/pastepass/chart/Chart.yaml | awk '{print $2}' | tr -d '"')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push pastepass
        uses: docker/build-push-action@v5
        with:
          file: ./charts/pastepass/build/Dockerfile
          context: ./charts/pastepass/build/
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ vars.CONTAINER_REGISTRY }}/pastepass:${{ steps.extract_version.outputs.version }}
